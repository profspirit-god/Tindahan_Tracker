function generateProductCode(category){
  const prefix = CATEGORY_PREFIX[category] || "GEN";
  let maxNum = 0;
  state.inventory.forEach(it=>{
    if(it.code && it.code.startsWith(prefix+"-")){
      const num = parseInt(it.code.split('-')[1],10);
      if(!isNaN(num) && num>maxNum) maxNum = num;
    }
  });
  return `${prefix}-${String(maxNum+1).padStart(4,'0')}`;
}

function ensureInventoryFields(){
  state.inventory.forEach(it=>{
    if(!it.category) it.category = "Other";
    if(!it.storageType) it.storageType = "Dry";
    if(!it.unit) it.unit = "pcs";
    if(!it.supplier) it.supplier = "";
    if(!it.code) it.code = generateProductCode(it.category);
    if(it.expiryDate === undefined) it.expiryDate = "";
  });
}

function peso(n){
  n = Number(n)||0;
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('en-PH',{maximumFractionDigits:0});
  return (neg?"-":"") + "₱" + s;
}

async function loadState(){
  const { data, error} = await sb
    .from("app_state")
    .select("data")
    .eq("id", 1)
    .single();

  if (!error && data.data) {
    state = Object.assign(state, data.data);
    if (!state.household || state.household.length === 0) {
      state.household = DEFAULT_HOUSEHOLD.map(h => ({ ...h }));
    }
    syncStatus = "ok";
  } else {
    syncStatus = "error";
  }
  loaded = true;
}

async function saveState(){
  const { error } = await sb
    .from("app_state")
    .update({ data: state })
    .eq("id", 1);
  syncStatus = error ? "error" : "ok";
}

function downloadFile(filename, mime, content){
  const blob = new Blob(['\ufeff', content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

function downloadWordSummary(){
  const now = new Date();
  const sel = window._selMonth || now.toISOString().slice(0,7);
  const [y, mo] = sel.split('-');
  const monthLabel = `${MONTHS[parseInt(mo,10)-1]} ${y}`;
  const sum = getMonthSummary(sel);
  const unpaid = state.payables.filter(p=>p.status!=="Paid").sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  const exp = getExpansionInsights(sel);
  const genDate = now.toLocaleDateString('en-PH', {year:'numeric', month:'long', day:'numeric'});

  let out = "";
  const line = (ch="=") => out += ch.repeat(44) + "\n";
  const row = (label, val) => out += `${label.padEnd(30)} ${val}\n`;

  out += "TINDAHAN TRACKER — MONTHLY SUMMARY\n";
  out += `Month: ${monthLabel}    Generated: ${genDate}\n`;
  line();
  out += "\nCASH SUMMARY\n"; line("-");
  row("Sales In", peso(sum.salesIn));
  row("Stock Purchases Out", peso(sum.purchOut));
  row("GCash Fees Earned", peso(sum.feeIn));
  row("Store Operating Result", peso(sum.opResult));
  row("Household Budget", peso(sum.householdTotal));
  row("Net After Household Draw", peso(sum.net));
  out += `\nVERDICT: ${sum.net>=0 ? "PROFITABLE THIS MONTH" : "NEEDS ATTENTION"}\n`;

  out += "\nHOUSEHOLD BUDGET BREAKDOWN\n"; line("-");
  state.household.forEach(h => row(h.cat, `Budget ${peso(h.budget)} / Actual ${peso(h.actual)}`));

  out += `\nOUTSTANDING LOANS / UTANG (${peso(sum.unpaidTotal)} total)\n`; line("-");
  if(unpaid.length===0) out += "No outstanding loans.\n";
  else unpaid.forEach(p => row(`${p.name} (${p.item||''})`, `${peso(p.amt)} · due ${p.due||'—'}`));

  out += `\nBUSINESS EXPANSION (STALL) — THIS MONTH\n`; line("-");
  row("Total Spent", peso(exp.total));
  if(exp.rows.length===0) out += "No entries this month.\n";
  else exp.rows.forEach(r => row(`${r.date} ${r.item}`, peso(r.amt)));

  out += "\nTOP ITEMS INVENTORY SNAPSHOT\n"; line("-");
  if(state.inventory.length===0) out += "No items listed yet.\n";
  else state.inventory.forEach(r => row(`${r.code} ${r.name}`, `Stock ${r.stock} ${r.unit} · Margin ${peso((r.price||0)-(r.cost||0))}`));

  downloadFile(`Tindahan_Summary_${sel}.txt`, 'text/plain;charset=utf-8', out);
}

function updHousehold(i,field,val){
  const oldVal = Number(state.household[i][field]) ||0;
  const parsed = parseFloat(val);
  const newVal = isNaN(parsed) ? 0 : parsed;

  if(oldVal > 0 && newVal === 0){
    const ok = confirm(`Babaguhin ang ${state.household[i].cat} mula ${oldVal} papuntang 0?\n\nChange ${state.household[i].cat} from ${oldVal} to 0?`);
    if(!ok){ render(); return; }
  }

  if(!state.householdHistory) state.householdHistory = [];
  state.householdHistory.push({
    cat: state.household[i].cat,
    field: field,
    oldVal: oldVal,

function subtractHouseholdExpense(i){

        ${isOpen ? `<div class="item-row-body">

function restockItem(i){
  const item = state.inventory[i];
  if(item.isComposite){ openQtyModal(i, 'restock'); return; }
  const input = prompt(`Ilan ang idadagdag sa stock ng ${item.name}?\n\nHow many ${item.unit} to add?`);
  if(input === null) return;
  const qty = parseFloat(input);
  if(isNaN(qty) || qty<=0){ alert("Please enter a valid amount."); return; }
  applyStockDelta(i, 'restock', qty, item.unit);
}
function sellItem(i){
  const item = state.inventory[i];
  if(item.isComposite){ openQtyModal(i, 'sell'); return; }
  const input = prompt(`Ilan ang naibenta/nagamit na ${item.name}?\n\nHow many ${item.unit} sold/used?`);
  if(input === null) return;
  const qty = parseFloat(input);
  if(isNaN(qty) || qty<=0){ alert("Please enter a valid amount."); return; }
  applyStockDelta(i, 'sell', qty, item.unit);
}
function spoilItem(i){
  const item = state.inventory[i];
  if(item.isComposite){ openQtyModal(i, 'spoil'); return; }
  const input = prompt(`Ilan ang nasira/naaksaya na ${item.name}?\n\nHow many ${item.unit} spoiled/wasted?`);
  if(input === null) return;
  const qty = parseFloat(input);
  if(isNaN(qty) || qty<=0){ alert("Please enter a valid amount."); return; }
  applyStockDelta(i, 'spoil', qty, item.unit);
}

function applyStockDelta(idx, action, baseAmt, unitLabel){
  const item = state.inventory[idx];
  const oldStock = Number(item.stock)||0;
  const qtyChange = action==='restock' ? baseAmt : -baseAmt;
  const newStock = action==='restock' ? oldStock + baseAmt : Math.max(0, oldStock - baseAmt);
  const actionLabel = action==='restock' ? 'Restock' : action==='sell' ? 'Sold/Used' : 'Spoiled/Wasted';
  logStockChange(item.name, unitLabel ? `${actionLabel} (${unitLabel})` : actionLabel, qtyChange, oldStock, newStock);
  item.stock = newStock;
  saveState();
  closeItemModal();
  render();
}

function openQtyModal(itemIdx, action){
  const item = state.inventory[itemIdx];
  const titleMap = {restock:'Restock', sell:'Sold / Used', spoil:'Spoiled / Wasted'};
  const sheet = document.getElementById('item-modal-sheet');
  sheet.innerHTML = `
    <div class="modal-title-row"><h3>${titleMap[action]} — ${escapeHtml(item.name)}</h3><button class="modal-x" onclick="closeItemModal()">✕</button></div>
    <label>Unit</label>
    <select id="qty-unit">${item.compositeLevels.map((l,i)=>`<option value="${i}">${escapeHtml(l.unit)}</option>`).join('')}</select>
    <label>Quantity</label>
    <input type="number" id="qty-amount" placeholder="0">
    <button class="btn btn-primary" onclick="submitQtyModal(${itemIdx}, '${action}')">Confirm</button>
  `;
  document.getElementById('item-modal-overlay').classList.add('open');
}

function submitQtyModal(itemIdx, action){
  const item = state.inventory[itemIdx];
  const levelIdx = parseInt(document.getElementById('qty-unit').value,10);
  const amt = parseFloat(document.getElementById('qty-amount').value);
  if(isNaN(amt) || amt<=0){ alert('Please enter a valid amount.'); return; }
  const baseAmt = amt * unitsPerBase(item.compositeLevels, levelIdx);
  applyStockDelta(itemIdx, action, baseAmt, `${amt} ${item.compositeLevels[levelIdx].unit}`);
}

function getInventoryValue(){
  return state.inventory.reduce((acc, r)=>{
    const stock = Number(r.stock)||0;
    acc.costValue += stock * (Number(r.cost)||0);
    acc.saleValue += stock * (Number(r.price)||0);
    return acc;
  }, {costValue:0, saleValue:0});
}

function getDailySellRate(itemName, windowDays){
  windowDays = windowDays || 14;
  const cutoff = Date.now() - windowDays*86400000;
  const sold = (state.stockHistory||[]).filter(h=>
    h.item===itemName && h.action==='Sold/Used' && new Date(h.time).getTime() >= cutoff
  );
  if(sold.length===0) return 0;
  const totalQty = sold.reduce((s,h)=>s+Math.abs(h.qtyChange||0),0);
  return totalQty / windowDays;
}

function logStockChange(itemName, action, qtyChange, oldStock, newStock){
  if(!state.stockHistory) state.stockHistory = [];
  state.stockHistory.push({
    item: itemName, action, qtyChange, oldStock, newStock,
    by: currentUser || 'Unknown', time: new Date().toISOString()
  });
}

function unitsPerBase(levels, idx){
  let units = 1;
  for(let i=idx; i<levels.length-1; i++){
    units *= Number(levels[i].multiplier)||1;
  }
  return units;
}

function breakdownStock(item){
  if(!item.isComposite) return `${item.stock} ${item.unit}`;
  let remaining = Number(item.stock)||0;
  const parts = [];
  for(let i=0;i<item.compositeLevels.length;i++){
    const per = unitsPerBase(item.compositeLevels, i);
    const count = Math.floor(remaining / per);
    if(count>0){ parts.push(`${count} ${item.compositeLevels[i].unit}${count!==1?'s':''}`); remaining -= count*per; }
  }
  return parts.length===0 ? `0 ${item.compositeLevels[item.compositeLevels.length-1].unit}` : parts.join(', ');
}

function saveItemForm(){
  const name = document.getElementById('im-name').value.trim();
  if(!name){ alert('Item name is required.'); return; }
  const category = document.getElementById('im-category').value;
  const isComposite = document.getElementById('im-is-composite').checked;

  const data = {
    name, category,
    storageType: document.getElementById('im-storage').value,
    supplier: document.getElementById('im-supplier').value.trim(),
    expiryDate: readDateSelects('im-expiry'),
    isComposite
  };

  if(isComposite){
    if(modalCompositeLevels.length < 2){ alert('A composite product needs at least 2 levels.'); return; }
    if(modalCompositeLevels.some(l=>!l.unit || !l.unit.trim())){ alert('Every level needs a unit name.'); return; }
    data.compositeLevels = modalCompositeLevels.map((l,i)=>({
      unit: l.unit.trim(),
      multiplier: i===modalCompositeLevels.length-1 ? 1 : (Number(l.multiplier)||1),
      forSale: !!l.forSale,
      cost: Number(l.cost)||0,
      price: Number(l.price)||0
    }));
    const base = data.compositeLevels[data.compositeLevels.length-1];
    data.unit = base.unit;
    data.cost = base.cost;
    data.price = base.price;
    data.stock = parseFloat(document.getElementById('im-stock-composite').value)||0;
    data.reorder = parseFloat(document.getElementById('im-reorder-composite').value)||0;
  } else {
    data.compositeLevels = null;
    data.unit = document.getElementById('im-unit').value;
    data.cost = parseFloat(document.getElementById('im-cost').value)||0;
    data.price = parseFloat(document.getElementById('im-price').value)||0;
    data.stock = parseFloat(document.getElementById('im-stock').value)||0;
    data.reorder = parseFloat(document.getElementById('im-reorder').value)||0;
  }

  if(itemModalEditIndex === null){
    data.code = generateProductCode(category);
    state.inventory.push(data);
  } else {
    data.code = state.inventory[itemModalEditIndex].code;
    state.inventory[itemModalEditIndex] = data;
  }
  saveState();
  closeItemModal();
  render();
}

function buildDateSelects(prefix, isoVal){
  const d = isoVal ? new Date(isoVal+"T00:00:00") : null;
  const day = d ? d.getDate() : '';
  const month = d ? d.getMonth()+1 : '';
  const year = d ? d.getFullYear() : new Date().getFullYear();
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const curY = new Date().getFullYear();
  const years = []; for(let y=curY-1;y<=curY+5;y++) years.push(y);
  return `<div style="display:flex; gap:6px;">
    <select id="${prefix}-day" style="flex:1;"><option value="">Day</option>
      ${Array.from({length:31},(_,i)=>i+1).map(n=>`<option value="${n}" ${n===day?'selected':''}>${n}</option>`).join('')}
    </select>
    <select id="${prefix}-month" style="flex:1.3;"><option value="">Month</option>
      ${months.map((m,i)=>`<option value="${i+1}" ${(i+1)===month?'selected':''}>${m}</option>`).join('')}
    </select>
    <select id="${prefix}-year" style="flex:1;"><option value="">Year</option>
      ${years.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}
    </select>
  </div>`;
}
function readDateSelects(prefix){
  const day = document.getElementById(prefix+'-day').value;
  const month = document.getElementById(prefix+'-month').value;
  const year = document.getElementById(prefix+'-year').value;
  if(!day || !month || !year) return "";
  return `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(todayStr());
  const target = new Date(dateStr);
  return Math.round((target - today) / 86400000);
}

function getMonthSummary(sel){
  const dRows = state.dailyLogs.filter(r=>monthKey(r.date)===sel);
  const salesIn = dRows.reduce((s,r)=>s+(r.salesIn||0),0);
  const purchOut = dRows.reduce((s,r)=>s+(r.purchOut||0),0);
  const feeIn = dRows.reduce((s,r)=>s+(r.fee||0),0);
  const movedOut = dRows.reduce((s,r)=>s+(r.movedDraw||0),0);
  const opResult = salesIn + feeIn - purchOut;
  const householdTotal = state.household.reduce((s,h)=>s+(Number(h.budget)||0),0);
  const net = opResult - householdTotal;
  const unpaidTotal = state.payables.filter(p=>p.status!=="Paid").reduce((s,p)=>s+(p.amt||0),0);
  return {salesIn, purchOut, feeIn, movedOut, opResult, householdTotal, net, unpaidTotal};
}

function getExpansionInsights(sel){
  const rows = (state.expansionLog||[]).filter(r=>monthKey(r.date)===sel).sort((a,b)=>a.date.localeCompare(b.date));
  let running = 0;
  const cumulative = rows.map(r=>{ running += r.amt; return {date:r.date, cumulative:running}; });
  const total = rows.reduce((s,r)=>s+(r.amt||0),0);
  return {rows, cumulative, total};
}

  const movedOut = dRows.reduce((s,r)=>s+(r.movedDraw||0),0);
  const opResult = salesIn + feeIn - purchOut;
  const householdTotal = state.household.reduce((s,h)=>s+(Number(h.budget)||0),0);
  const net = opResult - householdTotal;
  const unpaidTotal = state.payables.filter(p=>p.status!=="Paid").reduce((s,p)=>s+(p.amt||0),0);

    </div>

  </main>`;
}

function getDailyIncomeExpense(sel){
  const rows = state.dailyLogs.filter(r=>monthKey(r.date)===sel);
  const byDate = {};
  rows.forEach(r=>{
    if(!byDate[r.date]) byDate[r.date] = {date:r.date, income:0, expense:0};
    byDate[r.date].income += (r.salesIn||0) + (r.fee||0);
    byDate[r.date].expense += (r.purchOut||0);
  });
  return Object.values(byDate).map(d=>({...d, net: d.income - d.expense})).sort((a,b)=>a.date.localeCompare(b.date));
}

function getHouseholdByCategory(sel){
  const totals = {};
  (state.householdHistory||[]).forEach(h=>{
    if(h.field !== 'actual') return;
    if((h.time||'').slice(0,7) !== sel) return;
    const delta = (h.newVal||0) - (h.oldVal||0);
    totals[h.cat] = (totals[h.cat]||0) + delta;
  });
  return Object.entries(totals).map(([cat,total])=>({cat,total})).filter(r=>r.total !== 0);
}

function setRankMetric(v){ rankMetric = v; render(); }
function setRankOrder(v){ rankOrder = v; render(); }
function setHhRankOrder(v){ hhRankOrder = v; render(); }

function metricColorClass(metric, value){
  if(metric === 'expense') return 'amt neg';
  if(metric === 'income') return 'amt pos';
  return value>=0 ? 'amt pos' : 'amt neg';
}

function renderDailyRanking(daily){
  const sorted = [...daily].sort((a,b)=> rankOrder==='desc' ? b[rankMetric]-a[rankMetric] : a[rankMetric]-b[rankMetric]);
  if(sorted.length===0) return `<div class="empty">Wala pang data ngayong buwan.</div>`;
  return sorted.map(d=>`<div class="sumline"><span>${d.date}</span><b class="${metricColorClass(rankMetric, d[rankMetric])}">${peso(d[rankMetric])}</b></div>`).join('');
}

function renderHouseholdRanking(household){
  const sorted = [...household].sort((a,b)=> hhRankOrder==='desc' ? b.total-a.total : a.total-b.total);
  if(sorted.length===0) return `<div class="empty">Wala pang gastos na naka-record ngayong buwan.</div>`;
  return sorted.map(h=>`<div class="sumline"><span>${escapeHtml(h.cat)}</span><b>${peso(h.total)}</b></div>`).join('');
}

function buildMonthOptions(sel){
  const set = new Set(state.dailyLogs.map(r=>monthKey(r.date)).filter(Boolean));
  set.add(sel);
  const arr = Array.from(set).sort().reverse();
  return arr.map(m=>{
    const [y,mo] = m.split('-');
    const label = `${MONTHS[parseInt(mo,10)-1]} ${y}`;
    return `<option value="${m}" ${m===sel?'selected':''}>${label}</option>`;
  }).join('');
}
function changeMonth(v){

function delItem(key, idx){
  if(idx<0) return;
  const ok = confirm("Sigurado ka ba? Tatanggalin ito. \n\nAre you sure? This will delete this entry.");
  if(!ok) return;
  state[key].splice(idx,1);
  saveState();
  render();
}
function escapeHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function attachHandlers(){ /* all handlers are inline via onclick for simplicity/reliability */ }

function startApp(){
  (async function(){
    render ();
    await loadState();
    ensureInventoryFields();
    ensureUsername();
    render();
    startAutoRefresh();
  })();
}

function startAutoRefresh(){
  setInterval(async ()=>{
    if(view !== "home" && view !== "summary") return;
    const before = JSON.stringify(state);
    await loadState();
    if(JSON.stringify(state) !== before){
      render();
    }
  }, 20000);
}

if(localStorage.getItem('storeUnlocked') === 'true'){
  document.getElementById('lock-screen').style.display = 'none';
  startApp();
}
