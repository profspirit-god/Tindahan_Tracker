<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tindahan Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap');

  :root{
    --cover:#16423C;
    --cover-dark:#0E2E29;
    --page:#FFFBF1;
    --page-line:#E4D9BE;
    --ink:#2A2521;
    --ink-soft:#6B6255;
    --brass:#A9762F;
    --brass-light:#D9A55C;
    --teal:#2C6E7F;
    --teal-dark:#1F4F5C;
    --good:#2E6B4F;
    --good-bg:#E4EFE7;
    --bad:#8C3A32;
    --bad-bg:#F4E4E1;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cover);
    font-family:'Public Sans', system-ui, sans-serif;
    color:var(--ink);
    min-height:100vh;
    font-size:17px;
  }
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--page);
    background-image: repeating-linear-gradient(var(--page) 0 41px, var(--page-line) 41px 42px);
    background-attachment:local;
    position:relative;
    padding-bottom:40px;
  }
  #app::before{
    content:"";
    position:absolute; top:0; bottom:0; left:38px;
    width:2px; background:var(--bad); opacity:.35;
  }
  #lock-screen{
    position: fixed; inset:0; background: var(--cover); z-index:999;
    display: flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    color:var(--page); font-family:'publish Sans', sans-serif; padding:20px; text-align:center;
  }
  #lock-screen h2{font-family: 'Zilla Slab', serif; margin:0;}
  #lock-input{
    font-size:28px; letter-spacing:10px; text-align:center; width:180px;
    padding:12px; border-radius: 12px; border:none;
  }
  #lock-error{color:#F4A9A0; font-size:13px; height:16px;}
  #lock-btn{
    background:var(--teal); border:none; padding:12px 30px;
    border-radius:12px; font-weight:700; font-size:15px; cursor:pointer;
  }
  #username-screen{
    position:fixed; inset:0; background:var(--cover); z-index:998;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    color:var(--page); font-family: 'Public Sans', sana-serif; margin:0;}
  #username-screen h2{font-family: 'Zilla Slab', serif; margin:0;}
  #username-input{
    font-size:20px; text-align:center; width:220px;
    padding:12px; border-radius:12px; border:none;
  }
  #username-error{color:#F4A9A0; font-size:13px; min-height:16px;}
  #username-claim{background:none; border:none; color:var(--brass-light); text-decoration:underline; font-size:12.5px; cursor:pointer;}
  #user-badge{
    position:fixed; top:10px; left:10px; z-index:20;
    background:rgb(0,0,0,.35); color:#fff; font-size:12.5px; font-weight:600;
    padding:6px 12px; border-radius:20px; cursor:pointer;
  }
  header.top{
    background:var(--cover);
    background-image: linear-gradient(180deg, var(--cover), var(--cover-dark));
    color:var(--page);
    padding:22px 20px 18px;
    position:sticky; top:0; z-index:5;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  header.top h1{
    font-family:'Zilla Slab', serif;
    font-size:26px; margin:0; letter-spacing:.3px;
  }
  header.top p{margin:4px 0 0; font-size:13px; color:var(--brass-light); font-weight:500;}
  .backbar{
    display:flex; align-items:center; gap:10px;
  }
  .backbtn{
    background:rgba(255,255,255,.12); border:none; color:var(--page);
    width:38px; height:38px; border-radius:10px; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .backbtn:active{background:rgba(255,255,255,.25);}
  main{padding:18px 20px 10px; position:relative;}
  .grid-home{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px;
  }
  .tile{
    background:var(--page); border:2px solid var(--brass); border-radius:var(--radius);
    padding:18px 12px; text-align:center; cursor:pointer; min-height:108px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease;
  }
  .tile:active{transform:scale(.96); background:#FCF3DF;}
  .tile .ic{font-size:30px;}
  .tile .en{font-family:'Zilla Slab', serif; font-weight:600; font-size:16px; line-height:1.2;}
  .tile .fil{font-size:12.5px; color:var(--ink-soft);}
  .section-title{
    font-family:'Zilla Slab', serif; font-size:21px; font-weight:600; margin:2px 0 4px;
    color:var(--cover-dark);
  }
  .subtitle{font-size:13.5px; color:var(--ink-soft); margin:0 0 14px;}
  .card{
    background:#fff; border:1px solid var(--page-line); border-radius:var(--radius);
    padding:16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  label{display:block; font-size:13px; font-weight:600; color:var(--ink-soft); margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; padding:12px 12px; font-size:16px; border:1.5px solid var(--page-line);
    border-radius:10px; font-family:inherit; background:#FEFDFA; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{outline:2px solid var(--teal); border-color:var(--teal);}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:13px 18px; border-radius:12px; border:none; font-size:15.5px; font-weight:700;
    cursor:pointer; font-family:inherit;
  }
  .btn-primary{background:var(--teal); color:#fff; width:100%; margin-top:14px;}
  .btn-primary:active{background:var(--teal-dark);}
  .btn-ghost{background:transparent; color:var(--bad); border:1.5px solid var(--bad); padding:8px 14px; font-size:13.5px;}
  .entry{
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    padding:12px 0; border-bottom:1px dashed var(--page-line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .meta{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .entry .amt{font-weight:700; white-space:nowrap;}
  .amt.pos{color:var(--good);}
  .amt.neg{color:var(--bad);}
  .pill{
    display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;
    margin-left:6px;
  }
  .pill.paid{background:var(--good-bg); color:var(--good);}
  .pill.unpaid{background:var(--bad-bg); color:var(--bad);}
  .pill.overdue{background:var(--bad); color:#fff;}
  .del{background:none; border:none; color:var(--ink-soft); font-size:18px; cursor:pointer; padding:2px 6px;}
  .stamp{
    border:3px solid; border-radius:14px; padding:14px 10px; text-align:center;
    font-family:'Zilla Slab', serif; font-weight:700; font-size:18px; letter-spacing:1px;
    transform:rotate(-2deg); margin:16px 0;
  }
  .stamp.good{border-color:var(--good); color:var(--good); background:var(--good-bg);}
  .stamp.bad{border-color:var(--bad); color:var(--bad); background:var(--bad-bg);}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .sumline{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--page-line); font-size:15px;}
  .sumline:last-child{border:none;}
  .sumline b{font-weight:700;}
  .tip{
    background:#FCF3DF; border-left:4px solid var(--brass); padding:12px 14px; border-radius:8px;
    margin-bottom:10px; font-size:14.5px; line-height:1.5;
  }
  .help-h{font-family:'Zilla Slab', serif; font-weight:600; font-size:16.5px; color:var(--teal-dark); margin:18px 0 6px;}
  .help-p{font-size:14.5px; line-height:1.6; margin:0 0 8px; color:var(--ink);}
  .empty{text-align:center; color:var(--ink-soft); font-size:14px; padding:20px 0;}
  select{appearance:auto;}
  .field-inline{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0;}
  .field-inline input{width:110px; text-align:right;}
  .banner{
    font-size:12.5px; background:#FCF3DF; border:1px solid var(--brass-light); color:var(--ink-soft);
    padding:8px 12px; border-radius:10px; margin-bottom:14px;
  }
</style>
</head>
<body>
<div id="lock-screen">
  <h2>🔒 Tindahan Tracker</h2>
  <p>Enter the family PIN</p>
  <input type="password" id="lock-input" inputmode="numeric" maxlenght="4" autofocus>
  <div id="lock-error"></div>
  <button id="lock-btn" onclick="checkPin()">Unlock</button>
</div>
<div id="app"></div>

<div id="username-screen">
  <h2>👤 Sino Ka?</h2>
  <p>Enter your name (e.g. Father, Mother, Tita, your name)</p>
  <input type="text" id="username-input" placeholder="Your name" maxlenght="20">
  <div id="username-error"></div>
  <button id="lock-btn" onclick="submitUsername()">Continue</button>
  <button id="username-claim" style="display:none;" onclick="claimExistingName()">This is me - I'm using a new device</button>
</div>
<div id="user-badge" onclick="switchUser()"></div>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<script>
const SUPABASE_URL = "https://nwtdjlfdrqhzbzhxrecz.supabase.co";
const SUPABASE_KEY = "sb_publishable_j_U4f9uYgywLJ797IkUeCg_DGDnLhyT";

const sb = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const STORE_PIN = "2808";

function checkPin(){
  const val = document.getElementById('lock-input').value;
  if(val === STORE_PIN){
    localStorage.setItem('storeUnlocked', 'true');
    document.getElementById('lock-screen').style.display = 'none';
    startApp();
  } else {
    document.getElementById('lock-error').textContent = "Wrong PIN - try again";
    document.getElementById('lock-input').value = '';
  }
}
let currentUser = localStorage.getItem('storeUsername') || null;
let pendingClaimName = "";

function updateUserBadge(){
  const badge = document.getElementById('user-badge');
  if(badge) badge.textContent = currentUser ? `👤 ${currentUser} (tap to switch)` : '';
}

function ensureUsername(){
  if(!state.registeredUsers) state.registeredUsers = [];
  if(currentUser){
    updateUserBadge();
    return;
  }
  document.getElementById('username-screen').style.display = 'flex';
}

async function submitUsername(){
  const val = document.getElementById('username-input').value.trim();
  const errorE1 = document.getElementById('username-error');
  const claimBtn = document.getElementById('username-claim');
  if(!val){
    errorE1.textContent = "Please enter a name.";
    return;
  }
  const taken = state.registeredUsers.some(u => u.toLowerCase() === val.toLowerCase());
  if(taken){
    errorE1.textContent = "⚠ Username used - pick another, or confirm below if it's really you.";
    claimBtn.style.display = 'inline-block';
    pendingClaimName = val;
    return
  }
  state.registeredUsers.push(val);
  await saveState();
  currentUser = val;
  localStorage.setItem('storeUsername', val);
  document.getElementById('username-screen').style.display = 'none';
  updateUserBadge();
  render();
}

function claimExistingName(){
  currentUser = pendingClaimName;
  localStorage.setItem('storeUsername', pendingClaimName);
  document.getElementById('username-screen').style.display = 'none';
  document.getElementById('username-claim').style.display = 'none';
  updateUserBadge();
  render();
}

function switchUser(){
  const ok = confirm(`Switch away from "${currentUser}" on this device`);
  if(!ok) return;
  localStorage.removeItem('storeUsername');
  currentUser = null;
  document.getElementById('username-input').value = '';
  document.getElementById('username-error').textContent = '';
  document.getElementById('username-claim').style.display = 'none';
  document.getElementById('username-screen').style.display = 'flex';
}

document.addEventListener('DOMContentLoaded', ()=>{
  const input = document.getElementById('lock-input');
  if(input) input.addEventListener('keydoen', e=>{ if(e.key==='Enter') checkPin(); });
});

const STORAGE_KEY = "family-store-data";
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];

const DEFAULT_HOUSEHOLD = [
  {cat:"Boarding house rental", fil:"Upa sa bahay", budget:4500, actual:0},
  {cat:"Household food", fil:"Pagkain", budget:1000, actual:0},
  {cat:"Student allowance", fil:"Baon", budget:8000, actual:0},
  {cat:"Electricity", fil:"Kuryente", budget:5000, actual:0},
  {cat:"Cooking gas", fil:"Gas panluto", budget:1150, actual:0},
  {cat:"Tricycle gas", fil:"Gasolina", budget:500, actual:0},
  {cat:"Wifi", fil:"Wifi", budget:1206, actual:0},
];

let state = {
  dailyLogs: [],
  gcashLogs: [],
  payables: [],
  household: DEFAULT_HOUSEHOLD.map(h=>({...h})),
  inventory: [],
  householdHistory: [],
  stockHistory: [],
};
let view = "home";
let loaded = false;

function peso(n){
  n = Number(n)||0;
  const neg = n < 0;
  const s = Math.abs(n).toLocaleString('en-PH',{maximumFractionDigits:0});
  return (neg?"-":"") + "₱" + s;
}
function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function monthKey(dateStr){
  return (dateStr||"").slice(0,7);
}
function el(html){
  const d = document.createElement('div');
  d.innerHTML = html.trim();
  return d.firstElementChild;
}

async function loadState(){
  const { data, error} = await sb
    .from("app_state")
    .select("data")
    .eq("id", 1)
    .single();

  if (!error && data.data) { state = Object.assign(state, data.data);

    if (!state.household || state.household.length === 0) {
      state.household = DEFAULT_HOUSEHOLD.map(h => ({ ...h }));
    }
  }
  loaded = true;
}

async function saveState(){
  await sb
    .from("app_state")
    .update({ data: state })
    .eq("id", 1);
}

function go(v){
  view = v;
  render();
  window.scrollTo(0,0);
  if(v === "home" || v === "summary"){
    quickRefresh();
  }
}

async function quickRefresh(){
  await loadState();
  render();
}

function header(title, filTitle, showBack){
  return `
  <header class="top">
    <div class="backbar">
      ${showBack ? `<button class="backbtn" onclick="go('home')">‹</button>` : ''}
      <div>
        <h1>${title}</h1>
        ${filTitle ? `<p>${filTitle}</p>` : ''}
      </div>
    </div>
  </header>`;
}

function render(){
  const app = document.getElementById('app');
  if(!loaded){
    app.innerHTML = `<div style="padding:40px;text-align:center;color:#6B6255;">Loading…</div>`;
    return;
  }
  let html = "";
  if(view==="home") html = renderHome();
  else if(view==="daily") html = renderDaily();
  else if(view==="gcash") html = renderGcash();
  else if(view==="payables") html = renderPayables();
  else if(view==="household") html = renderHousehold();
  else if(view==="householdHistory") html = renderHouseholdHistory();
  else if(view==="inventory") html = renderInventory();
  else if(view==="summary") html = renderSummary();
  else if(view==="help") html = renderHelp();
  else if(view==="insights") html = renderInsights();
  else if(view==="stockHistory") html = renderStockHistory();
  app.innerHTML = html;
  attachHandlers();
  if(view==="insights"){
    const now = new Date();
    drawInsightCharts(window._selMonth || now.toISOString().slice(0,7));
  }
}


function renderHome(){
  return `
  ${header("Tindahan Tracker","Ang tatlong supot ng pera")}
  <main>
    <p class="subtitle">Tap a button below. Every family member sees the same records.</p>
    <div class="grid-home">
      <div class="tile" onclick="go('daily')"><div class="ic">🗓️</div><div class="en">Today's Entry</div><div class="fil">Ngayong Araw</div></div>
      <div class="tile" onclick="go('gcash')"><div class="ic">📲</div><div class="en">GCash</div><div class="fil">Padala't Cash-in</div></div>
      <div class="tile" onclick="go('payables')"><div class="ic">📒</div><div class="en">Utang / Loans</div><div class="fil">Utang sa Supplier</div></div>
      <div class="tile" onclick="go('household')"><div class="ic">🏠</div><div class="en">Household Budget</div><div class="fil">Gastos sa Bahay</div></div>
      <div class="tile" onclick="go('inventory')" style="position:relative;">
        ${state.inventory.filter(r=>Number(r.stock)<=Number(r.reorder)).length>0 ? `<span class="pill overdue" style="position:absolute; top:8px; right:8px;">${state.inventory.filter(r=>Number(r.stock)<=Number(r.reorder)).length}</span>` : ''}
        <div class="ic">📦</div><div class="en">Top Items</div><div class="fil">Mga Bentang Paninda</div>
      </div>
      <div class="tile" onclick="go('summary')"><div class="ic">📊</div><div class="en">Monthly Summary</div><div class="fil">Buod ng Buwan</div></div>
      <div class="tile" onclick="go('insights')"><div class="ic">📈</div><div class="en">Insights</div><div class="fil">Mga Tsart at Ranggo</div></div>
    </div>
    <div class="tile" style="margin-top:14px; grid-column:1/-1;" onclick="go('help')">
      <div class="ic">💡</div><div class="en">Help &amp; Tips</div><div class="fil">Gabay at mga Tip</div>
    </div>

    <div class="section-title" style="margin-top:22px;">Data Tools</div>
    <button class="btn" style="width:100%; background:var(--brass); color:#fff;" onclick="downloadWordSummary()">⬇ Download Summary</button>
    <button class="btn" style="width:100%; margin-top:10px; background:transparent; border:1.5px solid var(--bad); color:var(--bad);" onclick="resetData()">🗑 Reset for a Clean Slate</button>

  </main>`;
}

function resetData(){
  const ok = confirm("This will permanently delete Daily Entries, Gcash logs, and Loans, and zero out household 'actual' spending. Top Items will NOT be touched. Continue?");
  if(!ok) return;
  state.dailyLogs = [];
  state.gcashLogs = [];
  state.payables = [];
  state.household = state.household.map(h=>({...h, actual:0}));
  saveState();
  render();
}

function downloadFile(filename, mime, content){
  const blob = new Blob(['\ufeff', content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

function downloadWordSummary(){
  const now = new Date();
  const sel = Window._selMonth || now.toISOString().slice(0,7);
  const [y, mo] = sel.split('-');
  const monthLabel = `${MONTHS[parseInt(mo, 10)-1]} ${y}`;
  const dRows = state.dailyLogs.filter(r=>monthKey(r.date)===sel);
  const salesIn = dRows.reduce((s,r)=>s+(r.salesIn||0),0);
  const purchOut = dRows.reduce((s,r)=>s+(r.purchOut||0),0);
  const feeIn = dRows.reduce((s,r)=>s+(r.fee||0),0);
  const opResult = salesIn + feeIn - purchOut;
  const householdTotal = state.household.reduce((s,h)=>s+(Number(h.budget)||0),0);
  const net = opResult - householdTotal;
  const unpaid = state.payables.filter(p=>p.status!=="Paid").sort((a,b)=>(a.due||"").localeCompare(b.due||""));
  const unpaidTotal = unpaid.reduce((s,p)=>s+(p.amt||0),0);
  const genDate = now.toLocaleDateString('en-PH', {year:'numeric', month:'long', day:'numeric'});

  const style = `
    body{font-family:Calibre, Arial, sans-serif; color:#222; font-size:14px;}
    h1{font-size:22px; margin-bottom:2px;}
    h2{font-size:16px; margin-top:26px; border-bottom:2px solid #16423C; padding-bottom:4px; color:#16423C;}
    table{border-collapse:collapse; width:100%; margin-top:8px;}
    td, th{border:1px solid #999; padding:6px 10px; font-size:13px; text-align:left;}
    th{background:#EFE6CE}
    .verdict{font-weight:bold; font-size:15px; padding:8px; border:2px solid ${net>=0?'#2E6B4F':'#8C3A32'}; color:${net>=0?'#2E6BaF':'#8C3A32'}; display:inline-block; margin-top;10px;}
    .mute{color:#666; font-size:12px;}
  `;

  let html = `<html><head><meta charset="utf-8"><style>${style}</style></head><body>`;
  html += `<h1>Tindahan Tracker - Monthly Summary</h1>`;
  html += `<div class="muted">Month: ${monthLabel} &nbsp; ·&nbsp; Generated: ${genDate}</div>`;
  html += `<h2>Cash Summary</h2><table>
    <tr><th>Item</th><th>Amount</th></tr>
    <tr><td>Sales In</td><td>${peso(salesIn)}</td></tr>
    <tr><td>Stock Purchases Out</td><td>${peso(purchOut)}</td></tr>
    <tr><td>GCash Fees Earned</td><td>${peso(feeIn)}</td></tr>
    <tr><td><b>Net After Household Draw</b></td><td><b>${peso(opResult)}</b></td></tr>
    <tr><td>Household Budget (monthly)</td><td>${peso(householdTotal)}</td></tr>
    <tr><td><b>Net After Household Draw</b></td><td><b>${peso(net)}</b></td></tr>
  </table>`;
  html += `<div class="verdict">${net>=0 ? "PTOFITABLE THIS MONTH" : "NEEDS ATTENTION"}</div>`;
  html += `<h2>Household Budget Breakdown</h2><table>
    <tr><th>Category</th><th>Budget</th><th>Actual</th></tr>
    ${state.household.map(h=>`<tr><td>${escapeHtml(h.cat)}</td><td>${peso(h.budget)}</td><td>${peso(h.actual)}</td></tr>`).join('')}
  </table>`;
  html += `<h2>Outstanding Loans / Utang (${peso(unpaidTotal)} total)</h2>`;
  html += unpaid.lenght===0 ? `<p>No outstanding loans.🎉</p>` : `<table>
    <tr><th>Supplier / Lender</th><th>Item</th><th>Amount</th><th>Due Date</th></tr>

function updHousehold(i,field,val){
  const oldVal = Number(state.household[i][field]) ||0;
  const parsed = parseFloat(val);
  const newVal = isNaN(parsed) ? 0 : parsed;

  if(oldVal > 0 && newVal === 0){
    const ok = confirm(`Babaguhin ang ${state.household[i].cat} mula ${oldVal} papuntang 0?\n\nChange ${state.household[i].cat} from ${oldVal} to 0?`);
    if(!ok){ render(); return; }
  }

  if(!state.householdHistory) state.householdHistory = [];
  state.householdHistory.push({
    cat: state.household[i].cat,
    field: field,
    oldVal: oldVal,
    newVal: newVal,
    by: currentUser || 'Unkown',
    time: new Date().toISOString()
  });

  state.household[i][field] = newVal;
  saveState();
  render();
}
function addHouseholdCat(){
  const v = document.getElementById('h-new-cat').value.trim();
  if(!v) return;
  state.household.push({cat:v, fil:"", budget:0, actual:0});
  saveState();
  render();
}
function addHouseholdExpense(i){
  const input = prompt(`Magkano ang idadagdag sa ${state.household[i].cat}?\n\nHow much to add to ${state.household[i].cat}?`);
  if(input === null) return;
  const amt = parseFloat(input);
  if(isNaN(amt) || amt <= 0){ alert("Please enter a valid amount."); return; }
  const oldVal = Number(state.household[i].actual)||0;
  const newVal = oldVal + amt;
  if(!state.householdHistory) state.householdHistory = [];
  state.householdHistory.push({cat: state.household[i].cat, field:'actual', oldVal, newVal, by: currentUser||'Unknown', time: new Date().toISOString()});
  state.household[i].actual = newVal;
  saveState();
  render();
}

function subtractHouseholdExpense(i){
  const input = prompt(`Magkano ang babawasin sa ${state.household[i].cat}?\n\nHow much to subtract from ${state.household[i].cat}?`);
  if(input === null) return;
  const amt = parseFloat(input);
  if(isNaN(amt) || amt <= 0){ alert("Please enter a valid amount."); return; }
  const oldVal = Number(state.household[i].actual)||0;
  const newVal = Math.max(0, oldVal - amt);
  if(!state.householdHistory) state.householdHistory = [];
  state.householdHistory.push({cat: state.household[i].cat, field:'actual', oldVal, newVal, by: currentUser||'Unknown', time: new Date().toISOString()});
  state.household[i].actual = newVal;
  saveState();
  render();
}

function delHouseholdCat(i){
  const catName = state.household[i].cat;
  const ok = confirm(`Alisin ang "${catName}" sa listahan?\n\nRemove "${catName}" from the list? Past history stays, only future tracking stops.`);
  if(!ok) return;
  if(!state.householdHistory) state.householdHistory = [];
  state.householdHistory.push({
    cat: catName,
    field: 'category',
    oldVal: state.household[i].actual,
    newVal: 'DELETED',
    by: currentUser || 'Unknown',
    time: new Date().toISOString()
  });
  state.household.splice(i,1);
  saveState();
  render();
}

function restockItem(i){
  const input = prompt(`Ilan ang idadagdag sa stock ng ${state.inventory[i].name}?\n\nHow many units to add to ${state.inventory[i].name}?`);
  if(input === null) return;
  const qty = parseFloat(input);
  if(isNaN(qty) || qty <= 0){ alert("Please enter a valid amount."); return; }
  const oldStock = Number(state.inventory[i].stock)||0;
  const newStock = oldStock + qty;
  logStockChange(state.inventory[i].name, 'Restock', qty, oldStock, newStock);
  state.inventory[i].stock = newStock;
  saveState();
  render();
}

function sellItem(i){
  const input = prompt(`Ilan ang naibenta/nagamit na ${state.inventory[i].name}?\n\nHow many units sold/used of ${state.inventory[i].name}?`);
  if(input === null) return;
  const qty = parseFloat(input);
  if(isNaN(qty) || qty <= 0){ alert("Please enter a valid amount."); return; }
  const oldStock = Number(state.inventory[i].stock)||0;
  const newStock = Math.max(0, oldStock - qty);
  logStockChange(state.inventory[i].name, 'Sold/Used', -qty, oldStock, newStock);
  state.inventory[i].stock = newStock;
  saveState();
  render();
}

function logStockChange(itemName, action, qtyChange, oldStock, newStock){
  if(!state.stockHistory) state.stockHistory = [];
  state.stockHistory.push({

    by: currentUser || 'Unknown', time: new Date().toISOString()

}

function renderSummary(){
  const now = new Date();
  const defaultMonth = now.toISOString().slice(0,7);
  const sel = window._selMonth || defaultMonth;

  const salesIn = dRows.reduce((s,r)=>s+(r.salesIn||0),0);
  const purchOut = dRows.reduce((s,r)=>s+(r.purchOut||0),0);
  const feeIn = dRows.reduce((s,r)=>s+(r.fee||0),0);
  const movedOut = dRows.reduce((s,r)=>s+(r.movedDraw||0),0);
  const opResult = salesIn + feeIn - purchOut;
  const householdTotal = state.household.reduce((s,h)=>s+(Number(h.budget)||0),0);
  const net = opResult - householdTotal;
  const unpaidTotal = state.payables.filter(p=>p.status!=="Paid").reduce((s,p)=>s+(p.amt||0),0);

  const monthOptions = buildMonthOptions(sel);

  return `

}

function getDailyIncomeExpense(sel){
  const rows = state.dailyLogs.filter(r=>monthKey(r.date)===sel);
  const byDate = {};
  rows.forEach(r=>{
    if(!byDate[r.date]) byDate[r.date] = {date:r.date, income:0, expense:0};
    byDate[r.date].income += (r.salesIn||0) + (r.fee||0);
    byDate[r.date].expense += (r.purchOut||0);
  });
  return Object.values(byDate).map(d=>({...d, net: d.income - d.expense})).sort((a,b)=>a.date.localeCompare(b.date));
}

function getHouseholdByCategory(sel){
  const totals = {};
  (state.householdHistory||[]).forEach(h=>{
    if(h.field !== 'actual') return;
    if((h.time||'').slice(0,7) !== sel) return;
    const delta = (h.newVal||0) - (h.oldVal||0);
    totals[h.cat] = (totals[h.cat]||0) + delta;
  });
  return Object.entries(totals).map(([cat,total])=>({cat,total})).filter(r=>r.total !== 0);
}
let incomeExpenseChart = null;
let householdPieChart = null;
let rankMetric = "income";
let rankOrder = "desc";
let hhRankOrder = "desc";

function renderInsights(){
  const now = new Date();
  const defaultMonth = now.toISOString().slice(0,7);
  const sel = window._selMonth || defaultMonth;
  const monthOptions = buildMonthOptions(sel);
  const daily = getDailyIncomeExpense(sel);
  const household = getHouseholdByCategory(sel);

  return `
  ${header("Insights","Mga Tsart at Ranggo", true)}
  <main>
    <label>Select Month</label>
    <select id="ins-month" onchange="changeMonth(this.value)">${monthOptions}</select>

    <div class="section-title" style="margin-top:16px;">Income vs Store Expenses</div>
    <div class="card"><canvas id="incomeExpenseCanvas" height="220"></canvas></div>

    <div class="section-title">Household Spending by Category</div>
    <div class="card"><canvas id="householdPieCanvas" height="220"></canvas></div>

    <div class="section-title">Daily Ranking</div>
    <div class="card">
      <div class="row2">
        <select onchange="setRankMetric(this.value)">
          <option value="income" ${rankMetric==="income"?"selected":""}>Income</option>
          <option value="expense" ${rankMetric==="expense"?"selected":""}>Store Expense</option>
          <option value="net" ${rankMetric==="net"?"selected":""}>Net</option>
        </select>
        <select onchange="setRankOrder(this.value)">
          <option value="desc" ${rankOrder==="desc"?"selected":""}>Highest first</option>
          <option value="asc" ${rankOrder==="asc"?"selected":""}>Lowest first</option>
        </select>
      </div>
      <div style="margin-top:10px;">${renderDailyRanking(daily)}</div>
    </div>

    <div class="section-title">Household Category Ranking</div>
    <div class="card">
      <div class="row2">
        <select onchange="setHhRankOrder(this.value)">
          <option value="desc" ${hhRankOrder==="desc"?"selected":""}>Highest first</option>
          <option value="asc" ${hhRankOrder==="asc"?"selected":""}>Lowest first</option>
        </select>
      </div>
      <div style="margin-top:10px;">${renderHouseholdRanking(household)}</div>
    </div>
  </main>`;
}

function setRankMetric(v){ rankMetric = v; render(); }
function setRankOrder(v){ rankOrder = v; render(); }
function setHhRankOrder(v){ hhRankOrder = v; render(); }

function metricColorClass(metric, value){
  if(metric === 'expense') return 'amt neg';
  if(metric === 'income') return 'amt pos';
  return value>=0 ? 'amt pos' : 'amt neg';
}

function renderDailyRanking(daily){
  const sorted = [...daily].sort((a,b)=> rankOrder==='desc' ? b[rankMetric]-a[rankMetric] : a[rankMetric]-b[rankMetric]);
  if(sorted.length===0) return `<div class="empty">Wala pang data ngayong buwan.</div>`;
  return sorted.map(d=>`<div class="sumline"><span>${d.date}</span><b class="${metricColorClass(rankMetric, d[rankMetric])}">${peso(d[rankMetric])}</b></div>`).join('');
}

function renderHouseholdRanking(household){
  const sorted = [...household].sort((a,b)=> hhRankOrder==='desc' ? b.total-a.total : a.total-b.total);
  if(sorted.length===0) return `<div class="empty">Wala pang gastos na naka-record ngayong buwan.</div>`;
  return sorted.map(h=>`<div class="sumline"><span>${escapeHtml(h.cat)}</span><b>${peso(h.total)}</b></div>`).join('');
}

function destroyInsightCharts(){
  if(incomeExpenseChart){ incomeExpenseChart.destroy(); incomeExpenseChart = null; }
  if(householdPieChart){ householdPieChart.destroy(); householdPieChart = null; }
}

function drawInsightCharts(sel){
  destroyInsightCharts();
  const daily = getDailyIncomeExpense(sel);
  const household = getHouseholdByCategory(sel);

  const ieCanvas = document.getElementById('incomeExpenseCanvas');
  if(ieCanvas){
    incomeExpenseChart = new Chart(ieCanvas, {
      type: 'line',
      data: {
        labels: daily.map(d=>d.date.slice(8,10)),
        datasets: [
          {label:'Income', data: daily.map(d=>d.income), borderColor:'#2C6E7F', backgroundColor:'#2C6E7F', tension:0.2},
          {label:'Store Expense', data: daily.map(d=>d.expense), borderColor:'#8C3A32', backgroundColor:'#8C3A32', tension:0.2}
        ]
      },
      options: { responsive:true, plugins:{legend:{position:'bottom'}} }
    });
  }

  const pieCanvas = document.getElementById('householdPieCanvas');
  if(pieCanvas){
    if(household.length===0) return;
    householdPieChart = new Chart(pieCanvas, {
      type: 'pie',
      data: {
        labels: household.map(h=>h.cat),
        datasets: [{ data: household.map(h=>h.total),
          backgroundColor:['#A9762F','#2C6E7F','#8C3A32','#2E6B4F','#D9A55C','#16423C','#6B6255','#C98A2C'] }]
      },
      options: { responsive:true, plugins:{legend:{position:'bottom'}} }
    });
  }
}
function buildMonthOptions(sel){
  const set = new Set(state.dailyLogs.map(r=>monthKey(r.date)).filter(Boolean));
  set.add(sel);
  const arr = Array.from(set).sort().reverse();
  return arr.map(m=>{
    const [y,mo] = m.split('-');
    const label = `${MONTHS[parseInt(mo,10)-1]} ${y}`;
    return `<option value="${m}" ${m===sel?'selected':''}>${label}</option>`;
  }).join('');
}
function changeMonth(v){
  window._selMonth = v;
  render();
}


function renderHelp(){
  const tips = [
    "Fill in the Daily Entry every night before closing — it only takes 5 minutes and it's the single habit that fixes everything else.",
    "Never spend GCash float money on store stock, and never spend store sales money to top up GCash float. If you use GCash to pay a supplier, log it as a Stock Purchase in Daily Entry, not as GCash Cash-Out — the GCash tab is only for customer cash-in/cash-out service.",
    "Move money to 'Household' once, on a set schedule (e.g. every payday), instead of taking small amounts whenever needed.",
    "In Household Budget, use '+ Add' when a new expense comes in and '− Fix' if you entered the wrong amount — never retype the whole total from memory.",
    "When a supplier panel arrives unannounced, check the Utang tab first — if this month's due payments are tight, it's okay to say 'next visit' for a non-essential restock.",
    "Review the Monthly Summary together as a family once a month — it's meant to start a conversation, not to blame anyone."
  ];
  return `
  ${header("Help & Tips","Gabay sa Paggamit", true)}
  <main>
    <div class="banner">This app is shared — anyone in the family who opens it sees the same records. There's no password beyond the PIN, so only share it with family.</div>

    <div class="help-h">Pagpasok sa App (Getting In)</div>
    <p class="help-p"><b>PIN</b> — enter the family PIN once per device; it's remembered after that.</p>
    <p class="help-p"><b>Pangalan (Name)</b> — the first time on a new device, type your name (Father, Mother, Tita, etc.) so every entry shows who made it. Tap your name in the top-left corner anytime to switch users on that device.</p>

    <div class="help-h">Ang Tatlong Supot ng Pera (The 3 Pots)</div>
    <p class="help-p"><b>1. Store Cash</b> — pera para sa pagtitinda at pambili ng paninda. Kahit bayad sa supplier gamit ang GCash, dito pa rin ito ilalagay bilang Stock Purchase.</p>
    <p class="help-p"><b>2. GCash Float</b> — hiwalay na pera para lang sa cash-in/cash-out ng customer. Huwag ilagay dito ang pambayad sa supplier.</p>
    <p class="help-p"><b>3. Household / Bahay</b> — piniling halaga bawat buwan para sa gastos ng pamilya.</p>

    <div class="help-h">Paano Gamitin</div>
    <p class="help-p"><b>Today's Entry</b> — ilagay ang benta, pambili, at kita sa GCash tuwing gabi bago magsara.</p>
    <p class="help-p"><b>Utang / Loans</b> — bawat may utang na supplier o pautang, ilista dito para may paalala ang due date.</p>
    <p class="help-p"><b>Household Budget</b> — gumamit ng '+ Add' kapag may bagong gastos, '− Fix' kung mali ang nailagay. May ✕ din para tanggalin ang isang kategorya kung hindi na ito kailangan.</p>
    <p class="help-p"><b>View Entry History</b> — makikita dito ang bawat pagbabago sa Household Budget — kailan, magkano, at sino ang gumawa.</p>
    <p class="help-p"><b>Top Items</b> — huwag ilista lahat ng paninda — 20-30 pinakamabilis mabenta lang.</p>
    <p class="help-p"><b>Monthly Summary</b> — tignan ito bilang pamilya para makita kung kumikita talaga ang tindahan. I-download bilang Word file para may nakalimbag na kopya.</p>
    <p class="help-p"><b>Reset for a Clean Slate</b> — buburahin ang Daily Entries, GCash, at Loans; hindi kasama ang Top Items.</p>

    <div class="help-h">Tips</div>
    ${tips.map(t=>`<div class="tip">${t}</div>`).join('')}
  </main>`;
}

function delItem(key, idx){
  if(idx<0) return;
  const ok = confirm("Sigurado ka ba? Tatanggalin ito. \n\nAre you sure? This will delete this entry.");
  if(!ok) return;
  state[key].splice(idx,1);
  saveState();
  render();
}
function escapeHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function attachHandlers(){ /* all handlers are inline via onclick for simplicity/reliability */ }

function startApp(){
  (async function(){
    render ();
    await loadState();
    ensureUsername();
    render();
    startAutoRefresh();
  })();
}

function startAutoRefresh(){
  setInterval(async ()=>{
    if(view !== "home" && view !== "summary") return;
    const before = JSON.stringify(state);
    await loadState();
    if(JSON.stringify(state) !== before){
      render();
    }
  }, 20000);
}

if(localStorage.getItem('storeUnlocked') === 'true'){
  document.getElementById('lock-screen').style.display = 'none';
  startApp();
}
</script>
