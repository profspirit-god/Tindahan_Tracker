<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tindahan Tracker</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap");

      /* =====================================================================
         Tindahan Tracker design system (v31)
         Black on white. Numbers are the interface. No emoji, no decoration.
         One typeface (Work Sans). Status is never shown by colour alone:
         every money figure carries a sign/triangle and every verdict has words.
         Token NAMES are unchanged from v30 so inline styles keep working.
         ===================================================================== */
      :root {
        /* paper + ink */
        --page: #ffffff;
        --card: #ffffff;
        --input-bg: #ffffff;
        --ink: #000000;
        --ink-soft: #5e5e5e;
        --page-line: #d9d9d9; /* hairlines between rows */
        --field-line: #8a8a8a; /* edge of inputs and outline buttons (3:1 on white) */
        --accent-soft: #f2f2f2; /* quiet panels */
        --accent-soft-border: #d9d9d9;
        --accent-soft-text: #000000;
        /* legacy names, now pure ink so every old inline style stays monochrome */
        --cover: #000000;
        --cover-dark: #000000;
        --brass: #000000;
        --brass-light: #8a8a8a;
        --teal: #000000; /* primary action = black fill */
        --teal-dark: #333333;
        /* money: the only two colours in the app */
        --good: #1b6b3a;
        --good-bg: #eaf4ee;
        --bad: #b3261e;
        --bad-bg: #fbeae8;
        --bad-solid: #b3261e; /* solid red fills that carry white text */
        --radius: 10px;
        --radius-sm: 8px;
        --sidebar-w: 280px;
        /* icons drawn by CSS (so no emoji or glyph fonts are needed) */
        --i-menu: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%20fill=%27none%27%20stroke=%27black%27%20stroke-width=%272%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27%3E%3Cpath%20d=%22M4%206h16M4%2012h16M4%2018h16%22/%3E%3C/svg%3E");
        --i-bell: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%20fill=%27none%27%20stroke=%27black%27%20stroke-width=%272%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27%3E%3Cpath%20d=%22M6%208a6%206%200%200%201%2012%200c0%207%203%209%203%209H3s3-2%203-9%22/%3E%3Cpath%20d=%22M10.3%2021a1.94%201.94%200%200%200%203.4%200%22/%3E%3C/svg%3E");
        --i-undo: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%20fill=%27none%27%20stroke=%27black%27%20stroke-width=%272%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27%3E%3Cpath%20d=%22M9%2014%204%209l5-5%22/%3E%3Cpath%20d=%22M4%209h10.5a5.5%205.5%200%200%201%205.5%205.5a5.5%205.5%200%200%201-5.5%205.5H11%22/%3E%3C/svg%3E");
        --i-x: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%20fill=%27none%27%20stroke=%27black%27%20stroke-width=%272%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27%3E%3Cpath%20d=%22M18%206%206%2018%22/%3E%3Cpath%20d=%22m6%206%2012%2012%22/%3E%3C/svg%3E");
        --i-check: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%20fill=%27none%27%20stroke=%27black%27%20stroke-width=%272%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27%3E%3Cpath%20d=%22M20%206%209%2017l-5-5%22/%3E%3C/svg%3E");
        --i-chevron: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%20fill=%27none%27%20stroke=%27black%27%20stroke-width=%272%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27%3E%3Cpath%20d=%22m9%2018%206-6-6-6%22/%3E%3C/svg%3E");
        --i-arrow: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%20fill=%27none%27%20stroke=%27%235e5e5e%27%20stroke-width=%272.2%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27%3E%3Cpath%20d=%27m6%209%206%206%206-6%27/%3E%3C/svg%3E");
      }
      body.dark-mode {
        --page: #000000;
        --card: #121212;
        --input-bg: #121212;
        --ink: #f2f2f2;
        --ink-soft: #a3a3a3;
        --page-line: #2c2c2c;
        --field-line: #6e6e6e;
        --accent-soft: #1a1a1a;
        --accent-soft-border: #333333;
        --accent-soft-text: #f2f2f2;
        --cover: #000000;
        --cover-dark: #000000;
        --brass: #f2f2f2;
        --brass-light: #8a8a8a;
        --teal: #f2f2f2;
        --teal-dark: #cfcfcf;
        --good: #6fcf97;
        --good-bg: #0f2418;
        --bad: #ff8a80;
        --bad-bg: #2a0f0d;
        --i-arrow: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2024%2024%27%20fill=%27none%27%20stroke=%27%23a3a3a3%27%20stroke-width=%272.2%27%20stroke-linecap=%27round%27%20stroke-linejoin=%27round%27%3E%3Cpath%20d=%27m6%209%206%206%206-6%27/%3E%3C/svg%3E");
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--accent-soft);
        font-family: "Work Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
        min-height: 100vh;
        min-height: 100dvh;
        font-size: 16px;
        line-height: 1.45;
        font-variant-numeric: tabular-nums lining-nums;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        max-width: 520px;
        margin: 0 auto;
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--page);
        position: relative;
        padding-bottom: 48px;
      }
      h1,
      h2,
      h3 {
        font-family: inherit;
      }

      /* ---------- keyboard + focus ---------- */
      button:focus-visible,
      [onclick]:focus-visible,
      a:focus-visible,
      summary:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 2px;
      }
      input:focus,
      select:focus,
      textarea:focus {
        outline: 2px solid var(--ink);
        outline-offset: 1px;
        border-color: var(--ink);
      }

      /* ---------- header ---------- */
      header.top {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--page);
        color: var(--ink);
        padding: 14px 68px 12px 68px;
        min-height: 68px;
        display: flex;
        align-items: center;
        border-bottom: 1px solid var(--page-line);
      }
      header.top h1 {
        font-size: 22px;
        line-height: 1.2;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      header.top p {
        margin: 2px 0 0;
        font-size: 13.5px;
        color: var(--ink-soft);
        font-weight: 400;
      }
      /* phones: the undo button (left of the bell) only takes space while visible */
      @media (max-width: 899px) {
        body.has-undo header.top {
          padding-right: 124px;
        }
      }
      /* narrow phones (320-430px): slightly smaller title, tighter subtitle */
      @media (max-width: 430px) {
        header.top h1 {
          font-size: 20px;
          text-wrap: balance;
        }
        header.top p {
          font-size: 13px;
          line-height: 1.3;
          text-wrap: balance;
        }
      }
      main {
        padding: 20px 20px 12px;
        position: relative;
      }

      /* ---------- fixed controls: menu, bell, undo ---------- */
      #hamburger-btn,
      #notif-btn,
      #undo-btn {
        position: fixed;
        top: 12px;
        z-index: 30;
        width: 44px;
        height: 44px;
        padding: 0;
        border-radius: var(--radius-sm);
        background: var(--page);
        color: var(--ink);
        border: 1px solid var(--field-line);
        font-size: 0;
        line-height: 0;
        cursor: pointer;
        box-shadow: none;
      }
      #hamburger-btn {
        left: 12px;
      }
      #notif-btn {
        right: 12px;
      }
      #hamburger-btn::before,
      #notif-btn::before,
      #undo-btn::before {
        content: "";
        display: inline-block;
        vertical-align: middle;
        width: 22px;
        height: 22px;
        background: currentColor;
        -webkit-mask: var(--m) center / contain no-repeat;
        mask: var(--m) center / contain no-repeat;
      }
      #hamburger-btn::before {
        --m: var(--i-menu);
      }
      #notif-btn::before {
        --m: var(--i-bell);
      }
      #undo-btn::before {
        --m: var(--i-undo);
      }
      /* the undo button carries inline styles from v30; these win over them */
      #undo-btn {
        right: 64px !important;
        top: 12px !important;
        width: 44px !important;
        height: 44px !important;
        border-radius: var(--radius-sm) !important;
        background: var(--page) !important;
        color: var(--ink) !important;
        border: 1px solid var(--field-line) !important;
        box-shadow: none !important;
        font-size: 0 !important;
        padding: 0 !important;
      }
      .notif-badge {
        position: absolute;
        top: -7px;
        right: -7px;
        background: var(--bad-solid);
        color: #fff;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
        border-radius: 999px;
        min-width: 20px;
        height: 20px;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
        box-shadow: 0 0 0 2px var(--page);
      }

      /* ---------- sidebar ---------- */
      #sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        z-index: 35;
        display: none;
      }
      #sidebar-overlay.open {
        display: block;
      }
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: var(--sidebar-w);
        max-width: 88vw;
        z-index: 40;
        background: var(--page);
        color: var(--ink);
        border-right: 1px solid var(--page-line);
        transform: translateX(-100%);
        visibility: hidden;
        transition:
          transform 0.2s ease,
          visibility 0s linear 0.2s;
        display: flex;
        flex-direction: column;
        padding: 12px 12px 16px;
        overflow-y: auto;
      }
      #sidebar.open {
        transform: translateX(0);
        visibility: visible;
        transition-delay: 0s;
      }
      .sb-user {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 8px 14px;
        margin-bottom: 8px;
        border-bottom: 1px solid var(--page-line);
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      .sb-link {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        padding: 10px 10px;
        margin-bottom: 2px;
        border-radius: var(--radius-sm);
        color: var(--ink);
        text-decoration: none;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
      }
      .sb-link:active {
        background: var(--accent-soft);
      }
      .sb-link.active {
        background: var(--ink);
        color: var(--page);
        font-weight: 600;
      }
      .sb-link .ic {
        display: inline-flex;
        width: 22px;
        height: 22px;
        flex: none;
        align-items: center;
        justify-content: center;
      }
      .sb-link.sb-child {
        padding-left: 44px;
        font-weight: 400;
        min-height: 40px;
      }
      .sb-link.sb-child.active {
        font-weight: 600;
      }
      .sb-version {
        margin-top: auto;
        padding-top: 16px;
        font-size: 12px;
        color: var(--ink-soft);
        text-align: center;
      }
      svg.i {
        display: inline-block;
        vertical-align: -0.22em;
        flex: none;
      }
      .item-row-head b svg.i {
        margin-right: 8px;
      }

      /* ---------- type ---------- */
      .section-title {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0;
        margin: 26px 0 8px;
        color: var(--ink);
      }
      .subtitle {
        font-size: 13.5px;
        color: var(--ink-soft);
        margin: 0 0 14px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink-soft);
        margin: 14px 0 5px;
      }
      .card > label:first-child,
      .row2:first-child > div > label:first-child {
        margin-top: 0;
      }
      .help-h {
        font-weight: 600;
        font-size: 16px;
        color: var(--ink);
        margin: 22px 0 6px;
      }
      .help-p {
        font-size: 14.5px;
        line-height: 1.6;
        margin: 0 0 8px;
        color: var(--ink);
      }
      .empty {
        text-align: center;
        color: var(--ink-soft);
        font-size: 14px;
        padding: 22px 0;
      }

      /* ---------- verdict: a plain sentence, not a stamp ---------- */
      .verdict {
        margin: 6px 0 22px;
      }
      .verdict-line {
        margin: 0;
        font-size: 30px;
        line-height: 1.1;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .verdict-sub {
        margin: 6px 0 0;
        font-size: 14px;
        color: var(--ink-soft);
      }
      .verdict.good .verdict-line {
        color: var(--good);
      }
      .verdict.bad .verdict-line {
        color: var(--bad);
      }
      .verdict.none .verdict-line {
        font-size: 20px;
        font-weight: 500;
        color: var(--ink-soft);
      }

      /* ---------- surfaces ---------- */
      .card {
        background: var(--card);
        border: 1px solid var(--page-line);
        border-radius: var(--radius);
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: none;
      }
      .banner {
        font-size: 13.5px;
        line-height: 1.45;
        background: var(--accent-soft);
        border: 1px solid var(--page-line);
        color: var(--ink);
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        margin-bottom: 14px;
      }
      .tip {
        background: var(--accent-soft);
        padding: 12px 14px;
        border-radius: var(--radius-sm);
        margin-bottom: 10px;
        font-size: 14.5px;
        line-height: 1.55;
      }
      #offline-banner {
        background: var(--accent-soft);
        color: var(--ink);
        text-align: center;
        padding: 10px 12px;
        font-size: 13.5px;
        font-weight: 600;
        border-bottom: 1px solid var(--field-line);
      }

      /* ---------- rows ---------- */
      .entry {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid var(--page-line);
      }
      .entry:last-child {
        border-bottom: none;
      }
      .entry .meta,
      .meta {
        font-size: 13px;
        color: var(--ink-soft);
        margin-top: 2px;
      }
      .entry .amt {
        font-weight: 600;
        white-space: nowrap;
      }
      .sumline {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--page-line);
        font-size: 15px;
      }
      .sumline:last-child {
        border: none;
      }
      .sumline b {
        font-weight: 600;
      }
      .row2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      /* direction mark for money, drawn with borders so no font is involved */
      .amt.pos::before,
      .amt.neg::before {
        content: "";
        display: inline-block;
        width: 0;
        height: 0;
        margin-right: 6px;
        vertical-align: 1px;
        border-left: 4px solid transparent;
        border-right: 4px solid transparent;
      }
      .amt.pos::before {
        border-bottom: 6px solid currentColor;
      }
      .amt.neg::before {
        border-top: 6px solid currentColor;
      }
      .amt.pos {
        color: var(--good);
      }
      .amt.neg {
        color: var(--bad);
      }

      /* ---------- tags ---------- */
      .pill {
        display: inline-block;
        font-size: 12px;
        font-weight: 600;
        line-height: 1.5;
        padding: 1px 9px;
        border-radius: 999px;
        margin-left: 6px;
        border: 1px solid currentColor;
        background: transparent;
      }
      .pill.paid {
        color: var(--good);
        background: var(--good-bg);
      }
      .pill.unpaid {
        color: var(--bad);
        background: transparent;
      }
      .pill.overdue {
        background: var(--bad-solid);
        border-color: var(--bad-solid);
        color: #fff;
      }
      .code-badge {
        font-size: 11.5px;
        font-weight: 600;
        background: var(--accent-soft);
        color: var(--ink-soft);
        padding: 1px 7px;
        border-radius: 4px;
        margin-left: 6px;
      }

      /* ---------- inputs ---------- */
      input[type="text"],
      input[type="number"],
      input[type="date"],
      select,
      textarea {
        width: 100%;
        min-height: 46px;
        padding: 11px 12px;
        font-size: 16px;
        border: 1.5px solid var(--field-line);
        border-radius: var(--radius-sm);
        font-family: inherit;
        background: var(--input-bg);
        color: var(--ink);
      }
      select {
        appearance: none;
        -webkit-appearance: none;
        background-image: var(--i-arrow);
        background-repeat: no-repeat;
        background-position: right 12px center;
        background-size: 16px;
        padding-right: 38px !important;
      }
      ::placeholder {
        color: var(--ink-soft);
        opacity: 0.8;
      }

      /* ---------- buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 11px 18px;
        border-radius: var(--radius-sm);
        border: 1.5px solid transparent;
        font-size: 15.5px;
        font-weight: 600;
        line-height: 1.2;
        cursor: pointer;
        font-family: inherit;
      }
      .btn:active {
        opacity: 0.8;
      }
      .btn-primary {
        background: var(--teal);
        color: #fff;
        width: 100%;
        margin-top: 14px;
      }
      .btn-primary:active {
        background: var(--teal-dark);
      }
      body.dark-mode .btn-primary {
        color: var(--page);
      }
      .btn-ghost {
        background: transparent;
        color: var(--bad);
        border: 1.5px solid var(--bad);
        padding: 8px 14px;
        font-size: 13.5px;
      }
      /* v30 buttons paint a solid black/white fill inline with white text.
         In dark mode that fill becomes light, so the text must go dark. */
      body.dark-mode [style*="background:var(--teal)"],
      body.dark-mode [style*="background:var(--brass)"],
      body.dark-mode [style*="background:var(--ink)"] {
        color: var(--page) !important;
      }
      body.dark-mode [style*="background:var(--bad)"] {
        background: var(--bad-solid) !important;
        color: #fff !important;
      }

      /* ---------- remove / close / confirm icon buttons ---------- */
      .del,
      .modal-x,
      #chart-modal .modal-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        background: none;
        border: none;
        color: var(--ink-soft);
        font-size: 0;
        line-height: 0;
        cursor: pointer;
      }
      .del::before,
      .modal-x::before,
      #chart-modal .modal-close::before {
        content: "";
        width: 18px;
        height: 18px;
        background: currentColor;
        -webkit-mask: var(--i-x) center / contain no-repeat;
        mask: var(--i-x) center / contain no-repeat;
      }
      .del.ok::before {
        -webkit-mask-image: var(--i-check);
        mask-image: var(--i-check);
      }
      .del.ok {
        color: var(--ink);
      }
      .del:active {
        color: var(--bad);
      }
      .modal-x {
        border: 1px solid var(--page-line);
        border-radius: var(--radius-sm);
        color: var(--ink);
      }
      #chart-modal .modal-close {
        background: var(--page);
        color: var(--ink);
        border-radius: var(--radius-sm);
      }
      .chevron {
        display: inline-block;
        width: 20px;
        height: 20px;
        flex: none;
        font-size: 0;
        color: var(--ink-soft);
        transition: transform 0.15s;
      }
      .chevron::before {
        content: "";
        display: block;
        width: 100%;
        height: 100%;
        background: currentColor;
        -webkit-mask: var(--i-chevron) center / 16px 16px no-repeat;
        mask: var(--i-chevron) center / 16px 16px no-repeat;
      }
      .chevron.open {
        transform: rotate(90deg);
      }

      /* ---------- search, filters, item rows ---------- */
      .search-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      .search-row input {
        flex: 1;
      }
      .filter-row {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }

          if (ms <= 0) {

            pinCountdownTimer = null;
            if (le) le.textContent = "";

          localStorage.setItem("pinLockUntil", String(Date.now() + esc));

      function uiIcon(name, size) {
        const d = ICON_PATHS[name];
        if (!d) return "";
        const px = size || 20;
        return `<svg class="i" width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
      }
      // Chart colours follow the light/dark theme. Greys for the pie, ink for the main line,
      // and the same two money colours (green in / red out) used across the app.
      function chartColors() {
        const dark = document.body.classList.contains("dark-mode");
        const ramp = dark
          ? ["#f2f2f2", "#d4d4d4", "#b0b0b0", "#8c8c8c", "#6b6b6b", "#4d4d4d", "#363636", "#262626"]
          : ["#000000", "#2e2e2e", "#575757", "#808080", "#a8a8a8", "#c9c9c9", "#e0e0e0", "#f0f0f0"];
        return {
          ink: ramp[0],
          soft: dark ? "#8c8c8c" : "#8a8a8a",
          good: dark ? "#6fcf97" : "#1b6b3a",
          bad: dark ? "#ff8a80" : "#b3261e",
          inkFaint: dark ? "rgba(242,242,242,0.12)" : "rgba(0,0,0,0.08)",
          pie: ramp,
        };
      }
      // One plain sentence instead of a stamp. Display only: it reads the same
      // numbers the old stamp did and never writes anything.
      function verdictHtml(net, hasData) {
        if (!hasData)
          return `<div class="verdict none"><p class="verdict-line">No entries for this month yet.</p></div>`;
        if (net === 0)
          return `<div class="verdict"><p class="verdict-line">Even this month</p><p class="verdict-sub">After what the family drew from the store.</p></div>`;
        const ahead = net > 0;
        return `<div class="verdict ${ahead ? "good" : "bad"}"><p class="verdict-line">${ahead ? "Ahead by" : "Short by"} ${peso(Math.abs(net))}</p><p class="verdict-sub">This month, after what the family drew from the store.</p></div>`;
      }

      function groupBadge(key) {
        if (key === "supply") {
          const low = state.inventory.filter(
            (r) => Number(r.stock) <= Number(r.reorder),
          ).length;
          const exp = state.inventory.filter((r) => {
            const d = daysUntil(r.expiryDate);
            return d !== null && d <= 7;
          }).length;
          const n = low + exp;
          return n > 0 ? String(n) : "";
        }
        if (key === "credit") {
          if (!isOwner()) {
            let n2 = 0;
            (state.receivables || []).forEach((r) => {
              const b = getReceivableBalance(r);
              if (b <= 0) return;
              if (r.due && daysUntil(r.due) < 0) n2++;
            });
            return n2 > 0 ? String(n2) : "";
          }
          let n = 0;
          (state.payables || []).forEach((p) => {
            const b = getPayableBalance(p);
            if (b <= 0) return;
            const nd =
              p.type === "Installment"
                ? getInstallmentNextDue(p)
                : p.type === "Consignment"
                  ? getConsignmentNextDue(p)
                  : p.due;
            if (nd && daysUntil(nd) < 0) n++;
          });
          (state.receivables || []).forEach((r) => {
            const b = getReceivableBalance(r);
            if (b <= 0) return;
            if (r.due && daysUntil(r.due) < 0) n++;
          });
          return n > 0 ? String(n) : "";
        }
        return "";
      }

      function getLastDailyLogDate() {
        if (!state.dailyLogs || state.dailyLogs.length === 0) return null;
        return state.dailyLogs.reduce(
          (max, r) => (r.date && r.date > max ? r.date : max),
          state.dailyLogs[0].date || "",
        );
      }
      const NOTIF_ICONS = {
        "Low Stock": "package",
        "Expiring Soon": "clock",
        "Unpaid Loan": "notebook",
        "Dead Stock": "archive",
        "Price Alert": "tag",
        "Supplier Today": "truck",
        "No Entry": "pencil",
        Uncollected: "banknote",
        "Low Margin": "percent",
      };
      let notifExpandedGroups = {};
      function getNotifications() {
        const notifs = [];
        state.inventory
          .filter((r) => Number(r.stock) <= Number(r.reorder))
          .forEach((r) =>
            notifs.push({
              type: "Low Stock",
              text: `${r.name} — ${r.stock} ${r.unit} left`,
            }),
          );
        state.inventory
          .filter((r) => {
            const d = daysUntil(r.expiryDate);
            return d !== null && d <= 7;
          })
          .forEach((r) =>
            notifs.push({
              type: "Expiring Soon",
              text: `${r.name} — ${daysUntil(r.expiryDate) < 0 ? "EXPIRED" : daysUntil(r.expiryDate) + "d left"}`,
            }),
          );
        state.inventory
          .filter((r) => {
            if (!(Number(r.stock) > 0)) return false;
            const sold = (state.stockHistory || []).filter(
              (h) =>
                h.item === r.name && h.action && h.action.startsWith("Sold"),
            );
            const last = sold.length
              ? Math.max(...sold.map((h) => new Date(h.time).getTime()))
              : null;
            return !last || last < Date.now() - 45 * 86400000;
          })
          .forEach((r) =>
            notifs.push({
              type: "Dead Stock",
              text: `${r.name} — no sales in 45+ days, ${r.stock} ${r.unit} sitting`,
            }),
          );
        state.payables.forEach((p) => {
          const balance = getPayableBalance(p);
          if (balance <= 0) return;
          if (p.type === "Installment") {
            const nextDue = getInstallmentNextDue(p);
            const d = nextDue ? daysUntil(nextDue) : null;
            if (d !== null && d <= 3) {
              notifs.push({
                type: "Unpaid Loan",
                text: `${p.name} — ${peso(balance)} left, ${d < 0 ? "OVERDUE since " + nextDue : d === 0 ? "due today" : "due " + nextDue}`,
              });
            }
          } else if (p.type === "Consignment") {
            const nextDue = getConsignmentNextDue(p);
            if (nextDue === null) {
              notifs.push({
                type: "Unpaid Loan",
                text: `${p.name} (consignment) — ${peso(balance)} owed`,
              });
            } else {
              const d = daysUntil(nextDue);
              if (d !== null && d <= 3) {
                notifs.push({
                  type: "Unpaid Loan",
                  text: `${p.name} (consignment) — ${peso(balance)} owed, next visit ${d === 0 ? "today" : nextDue}`,
                });
              }
            }
          } else {
            notifs.push({
              type: "Unpaid Loan",
              text: `${p.name} — ${peso(balance)} due ${p.due || "—"}`,
            });
          }
        });
        (state.priceAlerts || []).forEach((a, i) => {
          if (!a.acknowledged)
            notifs.push({
              type: "Price Alert",
              text: `${a.item} (${a.supplier}): ${peso(a.oldPrice)} → ${peso(a.newPrice)}`,
              alertIdx: i,
            });
        });
        (state.receivables || []).forEach((r) => {
          const bal = getReceivableBalance(r);
          if (bal <= 0) return;
          const d = r.due ? daysUntil(r.due) : null;
          if (d !== null && d <= 3) {
            notifs.push({
              type: "Uncollected",
              text: `${r.name} — ${peso(bal)} to collect, ${d < 0 ? "OVERDUE since " + r.due : d === 0 ? "due today" : "due " + r.due}`,
            });
          }
        });
        (state.inventory || []).forEach((r) => {
          const price = Number(r.price) || 0;
          if (price <= 0) return;
          const pct = Math.round(
            ((price - (Number(r.cost) || 0)) / price) * 100,
          );
          if (pct < 10) {
            notifs.push({
              type: "Low Margin",
              text: `${r.name} — margin only ${pct}% (cost ${peso(r.cost)} vs sell ${peso(r.price)})`,
            });
          }
        });
        const todayName = WEEKDAYS[new Date().getDay()];
        state.suppliers
          .filter(
            (s) =>
              s.scheduleType === "Fixed Day" && s.scheduleDay === todayName,
          )
          .forEach((s) =>
            notifs.push({
              type: "Supplier Today",
              text: `${s.name} — ${s.category || "scheduled today"}`,
            }),
          );
        const lastLog = getLastDailyLogDate();
        if (lastLog) {
          const daysSince = -daysUntil(lastLog);
          if (daysSince >= 2) {
            notifs.push({
              type: "No Entry",
              text: `No Today's Entry logged in ${daysSince} days — last entry was ${lastLog}`,
            });
          } else if (daysSince === 1 && new Date().getHours() >= 18) {
            notifs.push({
              type: "No Entry",
              text: `Wala pang naitala ngayong araw — no entry logged yet today.`,
            });
          }
        }
        return notifs;
      }

      function generateProductCode(category) {
        const prefix = CATEGORY_PREFIX[category] || "GEN";
        let maxNum = 0;
        state.inventory.forEach((it) => {
          if (it.code && it.code.startsWith(prefix + "-")) {
            const num = parseInt(it.code.split("-")[1], 10);
            if (!isNaN(num) && num > maxNum) maxNum = num;
          }
        });
        return `${prefix}-${String(maxNum + 1).padStart(4, "0")}`;
      }

      function ensureInventoryFields() {
        if (!state.suppliers) state.suppliers = [];
        if (!state.priceAlerts) state.priceAlerts = [];
        if (!state.payables) state.payables = [];
        if (!state.receivables) state.receivables = [];
        if (!state.people) state.people = [];
        if (!state.auditLog) state.auditLog = [];
        if (state.people.length === 0 && (state.registeredUsers || []).length) {
          state.people = state.registeredUsers.map((n) => ({
            name: n,
            role: "Owner",
            codeHash: null,
            active: true,
          }));
        }
        state.payables.forEach((p) => {
          if (!p.type) p.type = "One-time";
          if (
            (p.type === "Installment" || p.type === "Consignment") &&
            !p.history
          )
            p.history = [];
          if (p.type === "Consignment" && !p.linkedItemIds)
            p.linkedItemIds = [];
        });
        state.inventory.forEach((it) => {
          if (!it.category) it.category = "Other";
          if (!it.storageType) it.storageType = "Dry";
          if (!it.unit) it.unit = "pcs";
          if (!it.supplier) it.supplier = "";
          if (!it.code) it.code = generateProductCode(it.category);
          if (it.expiryDate === undefined) it.expiryDate = "";
          if (!it.supplierPrices) it.supplierPrices = [];
          if (it.consignmentStock === undefined) it.consignmentStock = 0;
        });
      }

      function showOfflineBanner(show) {
        const banner = document.getElementById("offline-banner");
        if (banner) banner.style.display = show ? "block" : "none";
      }

      window.addEventListener("online", () => {
        if (isOfflineMode) {
          isOfflineMode = false;
          showOfflineBanner(false);
          processOfflineQueue();
        }
      });

      window.addEventListener("offline", () => {
        isOfflineMode = true;
        showOfflineBanner(true);
      });

      async function processOfflineQueue() {
        const queued = localStorage.getItem(OFFLINE_QUEUE_KEY);
        if (!queued) return;

        try {
          const pendingState = JSON.parse(queued);
          // Basic conflict check: if server has newer data, warn user
          const { data: current } = await sb
            .from("app_state")
            .select("data")
            .eq("id", 1)
            .single();
          const serverSavedAt = current?.data?._meta?.lastSavedAt;
          const queueSavedAt = pendingState._meta?.lastSavedAt;

          if (serverSavedAt && queueSavedAt && serverSavedAt > queueSavedAt) {
            const proceed = confirm(
              "Data conflict!\n\nSomeone updated the data online while this device was offline.\n\nOK = Overwrite server with this device's offline changes.\nCancel = Discard offline changes and fetch server data.",
            );
            if (!proceed) {
              localStorage.removeItem(OFFLINE_QUEUE_KEY);
              await quickRefresh();
              return;
            }
          }

          // Push to server
          const now = new Date().toISOString();
          pendingState._meta = { lastSavedAt: now, lastSavedBy: currentUser };

          const { error } = await sb
            .from("app_state")
            .update({ data: pendingState })
            .eq("id", 1);
          if (!error) {
            localStorage.removeItem(OFFLINE_QUEUE_KEY);
            state = pendingState;
            lastKnownSavedAt = now;
            syncStatus = "ok";
            render();
            console.log("Offline queue successfully synced.");
          } else {
            console.error("Failed to sync offline queue", error);
          }
        } catch (e) {
          console.error("Error processing offline queue", e);
        }
      }

      function peso(n) {
        n = Number(n) || 0;
        const neg = n < 0;
        const s = Math.abs(n).toLocaleString("en-PH", {
          maximumFractionDigits: 0,
        });
        return (neg ? "-" : "") + "₱" + s;
      }
      function todayStr() {
        const d = new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }
      function monthKey(dateStr) {
        return (dateStr || "").slice(0, 7);
      }
      function prevMonthKey(sel) {
        const [y, m] = (sel || "").split("-").map(Number);
        if (!y || !m) return "";
        const d = new Date(Date.UTC(y, m - 2, 1));
        return d.toISOString().slice(0, 7);
      }
      function el(html) {
        const d = document.createElement("div");
        d.innerHTML = html.trim();
        return d.firstElementChild;
      }

      async function loadState() {
        // If offline and we have a queue, use the queue so the app still works!
        if (!navigator.onLine && localStorage.getItem(OFFLINE_QUEUE_KEY)) {
          try {
            state = JSON.parse(localStorage.getItem(OFFLINE_QUEUE_KEY));
            syncStatus = "offline";
            showOfflineBanner(true);
            loaded = true;
            return;
          } catch (e) {
            console.warn("Failed to parse offline queue", e);
          }
        }

        try {
          const { data, error } = await sb
            .from("app_state")
            .select("data")
            .eq("id", 1)
            .single();
          if (!error && data.data) {
            state = Object.assign(state, data.data);
            if (!state.household || state.household.length === 0) {
              state.household = DEFAULT_HOUSEHOLD.map((h) => ({ ...h }));
            }
            lastKnownSavedAt = (state._meta && state._meta.lastSavedAt) || null;
            syncStatus = "ok";
          } else {
            syncStatus = "error";
          }
        } catch (e) {
          console.warn("Load failed, likely offline.", e);
          syncStatus = "error";
        }
        loaded = true;
      }

      let isReadOnly = false;

      async function saveState() {
        if (isReadOnly) {
          console.warn("Read-only mode ON — skipping saveState");
          syncStatus = "readonly";
          return;
        }

        const now = new Date().toISOString();
        state._meta = { lastSavedAt: now, lastSavedBy: currentUser };

        // If offline, save to queue immediately
        if (!navigator.onLine || isOfflineMode) {
          localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(state));
          syncStatus = "offline";
          showOfflineBanner(true);
          return;
        }

        if (lastKnownSavedAt) {
          try {
            const { data: current, error } = await sb
              .from("app_state")
              .select("data")
              .eq("id", 1)
              .single();
            if (error) throw error;
            const serverSavedAt =
              current && current.data && current.data._meta
                ? current.data._meta.lastSavedAt
                : null;
            if (serverSavedAt && serverSavedAt !== lastKnownSavedAt) {
              const proceed = confirm(
                "Someone else updated the data on another device since this one last loaded.\n\nSaving now may overwrite their changes.\n\nOK = Save anyway\nCancel = Don't save (refresh the page first to get the latest data)",
              );
              if (!proceed) {
                syncStatus = "conflict";
                return;
              }
            }
          } catch (e) {
            // Network error during conflict check -> queue it
            console.warn(
              "Network error during save check, queueing offline.",
              e,
            );
            localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(state));
            syncStatus = "offline";
            showOfflineBanner(true);
            return;
          }
        }

        lastKnownSavedAt = now;
        try {
          const { error } = await sb
            .from("app_state")
            .update({ data: state })
            .eq("id", 1);
          if (error) throw error;
          syncStatus = "ok";
          localStorage.removeItem(OFFLINE_QUEUE_KEY); // Clear queue on successful save
          showOfflineBanner(false);
        } catch (e) {
          console.warn("Save failed, queueing offline.", e);
          localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(state));
          syncStatus = "offline";
          showOfflineBanner(true);
        }
      }

      async function computeSHA256(text) {
        const enc = new TextEncoder();
        const buf = await crypto.subtle.digest("SHA-256", enc.encode(text));
        return Array.from(new Uint8Array(buf))
          .map((b) => b.toString(16).padStart(2, "0"))
          .join("");
      }

      async function exportAllData() {
        const content = JSON.stringify(state, null, 2);
        const hash = await computeSHA256(content);
        const ts = new Date().toISOString().replace(/[:.]/g, "-");
        downloadFile(
          `tindahan_state_${ts}.json`,
          "application/json;charset=utf-8",
          content,
        );
        alert("Exported full app state. SHA256: " + hash);
      }

      async function exportRows(table) {
        if (!state[table]) {
          alert("No such table: " + table);
          return;
        }
        const content = JSON.stringify(state[table], null, 2);
        const hash = await computeSHA256(content);
        const ts = new Date().toISOString().replace(/[:.]/g, "-");
        downloadFile(
          `${table}_rows_${ts}.json`,
          "application/json;charset=utf-8",
          content,
        );
        alert(`Exported ${table}. SHA256: ${hash}`);
      }

      function exportRowsCsv(table) {
        if (
          !state[table] ||
          !Array.isArray(state[table]) ||
          state[table].length === 0
        ) {
          alert("No rows to export for: " + table);
          return;
        }
        const rows = state[table];
        const cols = [];
        rows.forEach((r) =>
          Object.keys(r || {}).forEach((k) => {
            if (!cols.includes(k)) cols.push(k);
          }),
        );
        const esc = (v) => {
          if (v === null || v === undefined) return "";
          if (typeof v === "object")
            return '"' + JSON.stringify(v).replace(/"/g, '""') + '"';
          const s = String(v);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        };
        const lines = [cols.join(",")];
        rows.forEach((r) => lines.push(cols.map((c) => esc(r[c])).join(",")));
        const ts = new Date().toISOString().replace(/[:.]/g, "-");
        downloadFile(
          `${table}_rows_${ts}.csv`,
          "text/csv;charset=utf-8",
          lines.join("\r\n"),
        );
      }

          await saveState();

          render();

      }

      async function verifyBackupContent(content, expectedHash) {

      // Undo stack: stores recent destructive actions for quick reversible restore
      let undoStack = [];

      function pushUndo(action) {
        // action: {type, label, data}
        action._pushedAt = new Date().toISOString();
        undoStack.push(action);
        showUndoIndicator();
        // Auto-expire after 30s
        setTimeout(() => {
          const idx = undoStack.indexOf(action);
          if (idx !== -1) {
            undoStack.splice(idx, 1);
            showUndoIndicator();
          }
        }, 30000);
      }

      function showUndoIndicator() {
        const btn = document.getElementById("undo-btn");
        if (!btn) return;
        document.body.classList.toggle("has-undo", undoStack.length > 0);
        if (undoStack.length > 0) {
          btn.style.display = "flex";
          btn.title =
            undoStack[undoStack.length - 1].label || "Undo last action";
        } else btn.style.display = "none";
      }

      function undoLast() {
        if (undoStack.length === 0) {
          alert("Nothing to undo");
          return;
        }
        const action = undoStack.pop();
        try {
          switch (action.type) {
            case "delete-row":
              // restore a deleted row at original index
              if (!state[action.key]) state[action.key] = [];
              state[action.key].splice(action.idx, 0, action.item);
              break;
            case "delete-household-cat":
              if (!state.household) state.household = [];
              state.household.splice(action.idx, 0, action.item);
              break;
            case "delete-stock-history":
              if (!state.stockHistory) state.stockHistory = [];
              state.stockHistory.splice(action.idx, 0, action.item);
              break;
            case "delete-household-history":
              if (!state.householdHistory) state.householdHistory = [];
              state.householdHistory.splice(action.idx, 0, action.item);
              break;
            case "reset-snapshot":
              state = Object.assign({}, action.snapshot);
              break;
            default:
              console.warn("Unknown undo action", action);
          }
          saveState();
          render();
          alert("Undo completed: " + (action.label || action.type));
        } catch (err) {
          console.error("Undo failed", err);
          alert("Undo failed: " + err.message);
        }
        showUndoIndicator();
      }

      // Expose a helper for reversible migrations: pass forward and backward functions
      async function runReversibleMigration(name, forwardFn, backwardFn) {
        if (!confirm(`Run migration: ${name}?`)) return false;
        // Take snapshot so we can undo if needed
        const snapshot = JSON.parse(JSON.stringify(state));
        try {
          await forwardFn(state);
          await saveState();
          logAudit(
            "csv-import",
            "inventory",
            "",
            `${created} created, ${updated} updated`,
          );
          pushUndo({
            type: "reset-snapshot",
            label: "Undo CSV import",
            snapshot,
          });
          alert(
            `Migration ${name} applied. An undo entry is available for 30s.`,
          );
          return true;
        } catch (err) {
          // rollback to snapshot
          state = snapshot;
          await saveState();
          alert(`Migration ${name} failed and was rolled back: ${err.message}`);
          return false;
        }
      }

      function resetData() {
        if (!requireOwner()) return;
        const ok = confirm(
          "This will permanently delete Daily Entries, Gcash logs, and Loans, and zero out household 'actual' spending. Top Items will NOT be touched. Continue?",
        );
        if (!ok) return;
        const snapshot = JSON.parse(JSON.stringify(state));
        pushUndo({
          type: "reset-snapshot",
          label: "Restore full state (reset)",
          snapshot,
        });
        logAudit(
          "reset",
          "clean-slate",
          `daily ${state.dailyLogs.length}, gcash ${state.gcashLogs.length}, payables ${state.payables.length}`,
          "",
        );
        state.dailyLogs = [];
        state.gcashLogs = [];
        state.payables = [];
        state.household = state.household.map((h) => ({ ...h, actual: 0 }));
        saveState();
        render();
      }

      function downloadFile(filename, mime, content) {
        const blob = new Blob(["\ufeff", content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

      function downloadWordSummary() {
        const now = new Date();
        const sel = window._selMonth || now.toISOString().slice(0, 7);
        const [y, mo] = sel.split("-");
        const monthLabel = `${MONTHS[parseInt(mo, 10) - 1]} ${y}`;
        const sum = getMonthSummary(sel);
        const unpaid = state.payables
          .filter((p) => p.status !== "Paid")
          .sort((a, b) => (a.due || "").localeCompare(b.due || ""));
        const exp = getExpansionInsights(sel);
        const genDate = now.toLocaleDateString("en-PH", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });

        let out = "";
        const line = (ch = "=") => (out += ch.repeat(44) + "\n");
        const row = (label, val) => (out += `${label.padEnd(30)} ${val}\n`);

        out += "TINDAHAN TRACKER — MONTHLY SUMMARY\n";
        out += `Month: ${monthLabel}    Generated: ${genDate}\n`;
        line();
        out += "\nCASH SUMMARY\n";
        line("-");
        row("Sales In", peso(sum.salesIn));
        row("Stock Purchases Out", peso(sum.purchOut));
        row("GCash Fees Earned", peso(sum.feeIn));
        row("Store Operating Result", peso(sum.opResult));
        row("Household Budget (plan)", peso(sum.householdTotal));
        row("Moved to Household (actual)", peso(sum.movedOut));
        row("Net After Actual Draw", peso(sum.net));
        row("Net If Full Budget Drawn", peso(sum.netPlanned));
        row("Uncollected Suki Utang", peso(getReceivablesTotal()));
        out += `\nVERDICT: ${sum.net >= 0 ? "PROFITABLE THIS MONTH" : "NEEDS ATTENTION"}\n`;

        out += "\nHOUSEHOLD BUDGET BREAKDOWN\n";
        line("-");
        state.household.forEach((h) =>
          row(h.cat, `Budget ${peso(h.budget)} / Actual ${peso(h.actual)}`),
        );

        out += `\nOUTSTANDING LOANS / UTANG (${peso(sum.unpaidTotal)} total)\n`;
        line("-");
        if (unpaid.length === 0) out += "No outstanding loans.\n";
        else
          unpaid.forEach((p) =>
            row(
              `${p.name} (${p.item || ""})`,
              `${peso(p.amt)} · due ${p.due || "—"}`,
            ),
          );

        out += `\nBUSINESS EXPANSION (STALL) — THIS MONTH\n`;
        line("-");
        row("Total Spent", peso(exp.total));
        if (exp.rows.length === 0) out += "No entries this month.\n";
        else exp.rows.forEach((r) => row(`${r.date} ${r.item}`, peso(r.amt)));

        out += "\nTOP ITEMS INVENTORY SNAPSHOT\n";
        line("-");
        if (state.inventory.length === 0) out += "No items listed yet.\n";
        else
          state.inventory.forEach((r) =>
            row(
              `${r.code} ${r.name}`,
              `Stock ${r.stock} ${r.unit} · Margin ${peso((r.price || 0) - (r.cost || 0))}`,
            ),
          );

        downloadFile(
          `Tindahan_Summary_${sel}.txt`,
          "text/plain;charset=utf-8",
          out,
        );
      }

      function getInstallmentPaid(p) {
        return (p.history || []).reduce((s, h) => s + (h.amount || 0), 0);
      }
      function getConsignmentBalance(p) {
        const accrued = (p.history || [])
          .filter((h) => h.kind !== "remittance")
          .reduce((s, h) => s + (h.amount || 0), 0);
        const remitted = (p.history || [])
          .filter((h) => h.kind === "remittance")
          .reduce((s, h) => s + (h.amount || 0), 0);
        return Math.max(0, accrued - remitted);
      }
      function getConsignmentPayableForItem(code) {
        return state.payables.find(
          (p) =>
            p.type === "Consignment" && (p.linkedItemIds || []).includes(code),
        );
      }
      function getConsignmentNextDue(p) {
        const supplier = (state.suppliers || []).find((s) => s.name === p.name);
        if (
          !supplier ||
          supplier.scheduleType !== "Fixed Day" ||
          !supplier.scheduleDay
        )
          return null;
        const today = new Date(todayStr());
        const targetIdx = WEEKDAYS.indexOf(supplier.scheduleDay);
        if (targetIdx < 0) return null;
        const diff = (targetIdx - today.getDay() + 7) % 7;
        const due = new Date(today);
        due.setDate(due.getDate() + diff);
        return due.toISOString().slice(0, 10);
      }
      function getPayableBalance(p) {
        if (p.type === "Installment")
          return Math.max(0, (p.totalAmt || 0) - getInstallmentPaid(p));
        if (p.type === "Consignment") return getConsignmentBalance(p);
        if (p.status === "Paid") return 0;
        return Math.max(0, (p.amt || 0) - getInstallmentPaid(p));
      }

      function getInstallmentNextDue(p) {
        if (!p.startDate || !p.frequency) return null;
        const today = new Date(todayStr());
        let due = new Date(p.startDate);
        if (p.frequency === "monthly") {
          while (due < today) due.setMonth(due.getMonth() + 1);
        } else if (p.frequency === "annual") {
          while (due < today) due.setFullYear(due.getFullYear() + 1);
        } else {
          const step = p.frequency === "weekly" ? 7 : 1; // daily default
          while (due < today) due.setDate(due.getDate() + step);
        }
        return due.toISOString().slice(0, 10);
      }

            name: supplierEl.value,

        state.expansionLog.push({
          date,

        const total = state.household.reduce(
          (s, h) => s + (Number(h.budget) || 0),

        const totalActual = state.household.reduce(
          (s, h) => s + (Number(h.actual) || 0),
          0,
        );
        return `
  ${header("Household Budget", "Gastos ng Pamilya buwan-buwan", true)}
  <main>
    <p class="subtitle">Set one fixed monthly amount per category instead of taking money out as needed.</p>
    <div class="card">
      ${state.household
        .map(
          (h, i) => `
        <div style="padding:10px 0; border-bottom:1px solid var(--page-line);">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-weight:600;">${escapeHtml(h.cat)} <span style="font-weight:400; color:var(--ink-soft); font-size:12.5px;">(${escapeHtml(h.fil)})</span></div>
            <button class="del" aria-label="Remove" onclick="delHouseholdCat(${i})"></button>

          <div class="row2" style="margin-top:6px;">

            <div>

                <div style="flex:1; font-weight:700; padding:11px 0;">${peso(h.actual)}</div>
                <button class="btn" style="background:var(--teal); color:#fff; padding:10px 14px; font-size:13px;" onclick="addHouseholdExpense(${i})">+ Add</button>
                <button class="btn" style="background:var(--bad); color:#fff; padding:10px 14px; font-size:13px;" onclick="subtractHouseholdExpense(${i})">− Fix</button> 
              </div>
            </div>
          </div>
        </div>`,
        )

      <div style="display:flex; gap:8px; margin-top:12px;">

      </div>

    <div class="card">
      <div class="sumline"><span>Total Budget</span><b>${peso(total)}</b></div>
      <div class="sumline"><span>Total Actual</span><b>${peso(totalActual)}</b></div>
    </div>
  </main>`;
      }
      function renderHouseholdHistory() {
        const indexed = (state.householdHistory || [])
          .map((r, i) => ({ ...r, _idx: i }))
          .reverse();
        return `
  ${header("Household History", "Kasaysayan ng mga Pagbabago", true)}
  <main>
    <button class="btn" style="margin-bottom:14px; background:transparent; border:1.5px solid var(--teal); color:var(--teal);" onclick="go('household')">‹ Back to Household</button>
    <div class="card">
      ${
        indexed.length === 0
          ? `<div class="empty">Wala pang history.</div>`
          : indexed
              .slice(0, 150)
              .map((r) => {

                const dtStr = dt.toLocaleString("en-PH", {
                  month: "short",
                  day: "numeric",
                  hour: "numeric",
                  minute: "2-digit",
                });
                return `<div class="entry">
          <div>
            <div><b>${escapeHtml(r.cat)}</b> · ${r.field}</div>
            <div class="meta">${peso(r.oldVal)} → ${r.newVal === "DELETED" ? "DELETED" : peso(r.newVal)} · by ${escapeHtml(r.by)} · ${dtStr}</div>

        </div>`;

      function delHistoryEntry(idx) {
        const ok = confirm(
          "Tanggalin ang entry na ito sa history? Hindi ito maibabalik.\n\nDelete this history entry? This cannot be undone.",
        );
        if (!ok) return;
        const item = JSON.parse(JSON.stringify(state.householdHistory[idx]));
        pushUndo({
          type: "delete-household-history",
          label: "Restore household history",
          idx: idx,
          item,
        });
        state.householdHistory.splice(idx, 1);
        saveState();
        render();
      }
      function updHousehold(i, field, val) {
        if (!requireOwner()) return;
        const oldVal = Number(state.household[i][field]) || 0;
        const parsed = parseFloat(val);
        const newVal = isNaN(parsed) ? 0 : parsed;

        if (oldVal > 0 && newVal === 0) {
          const ok = confirm(
            `Babaguhin ang ${state.household[i].cat} mula ${oldVal} papuntang 0?\n\nChange ${state.household[i].cat} from ${oldVal} to 0?`,
          );
          if (!ok) {
            render();
            return;
          }
        }

        if (!state.householdHistory) state.householdHistory = [];
        state.householdHistory.push({
          cat: state.household[i].cat,
          field: field,
          oldVal: oldVal,
          newVal: newVal,
          by: currentUser || "Unkown",
          time: new Date().toISOString(),
        });

        state.household[i][field] = newVal;
        saveState();
        render();
      }
      function addHouseholdCat() {
        const v = document.getElementById("h-new-cat").value.trim();

        state.household.push({ cat: v, fil: "", budget: 0, actual: 0 });
        saveState();
        render();

      function openHouseholdAdjustModal(i, mode) {
        const cat = state.household[i].cat;
        const sheet = document.getElementById("item-modal-sheet");
        sheet.innerHTML = `

    <input type="number" id="hh-adjust-amt" placeholder="0" inputmode="decimal">
    <button class="btn btn-primary" onclick="submitHouseholdAdjust(${i}, '${mode}')">Confirm</button>
  `;
        document.getElementById("item-modal-overlay").classList.add("open");

      function submitHouseholdAdjust(i, mode) {
        const amt = parseFloat(document.getElementById("hh-adjust-amt").value);

          alert("Please enter a valid amount.");
          return;
        }
        closeItemModal();
        applyHouseholdAdjust(i, mode === "add" ? amt : -amt);
      }

      function applyHouseholdAdjust(i, signedAmt) {
        if (!requireOwner()) return;
        const oldVal = Number(state.household[i].actual) || 0;
        const newVal = Math.max(0, oldVal + signedAmt);
        if (!state.householdHistory) state.householdHistory = [];
        state.householdHistory.push({
          cat: state.household[i].cat,
          field: "actual",
          oldVal,
          newVal,
          by: currentUser || "Unknown",
          time: new Date().toISOString(),
        });
        state.household[i].actual = newVal;
        saveState();
        render();
      }

      function addHouseholdExpense(i) {
        openHouseholdAdjustModal(i, "add");
      }
      function subtractHouseholdExpense(i) {
        openHouseholdAdjustModal(i, "fix");
      }

      function delHouseholdCat(i) {
        if (!requireOwner()) return;
        const catName = state.household[i].cat;
        const ok = confirm(
          `Alisin ang "${catName}" sa listahan?\n\nRemove "${catName}" from the list? Past history stays, only future tracking stops.`,
        );
        if (!ok) return;
        const item = JSON.parse(JSON.stringify(state.household[i]));
        pushUndo({
          type: "delete-household-cat",
          label: `Restore household category ${catName}`,
          idx: i,
          item,
        });
        if (!state.householdHistory) state.householdHistory = [];
        state.householdHistory.push({
          cat: catName,
          field: "category",
          oldVal: state.household[i].actual,
          newVal: "DELETED",
          by: currentUser || "Unknown",
          time: new Date().toISOString(),
        });
        state.household.splice(i, 1);
        saveState();
        render();
      }

      function renderInventory() {
        const rows = state.inventory
          .map((r, i) => ({ ...r, _idx: i }))
          .filter((r) => {
            if (invCategoryFilter !== "All" && r.category !== invCategoryFilter)
              return false;
            if (
              invStorageFilter !== "All" &&
              r.storageType !== invStorageFilter
            )
              return false;
            if (invLowStockOnly && !(Number(r.stock) <= Number(r.reorder)))
              return false;
            if (invSearch.trim()) {
              const q = invSearch.toLowerCase();
              if (
                !r.name.toLowerCase().includes(q) &&
                !(r.code || "").toLowerCase().includes(q)
              )
                return false;
            }
            return true;
          });

        const val = getInventoryValue();
        const soon = state.inventory.filter(
          (r) =>
            daysUntil(r.expiryDate) !== null && daysUntil(r.expiryDate) <= 7,
        );
        const sortedRows = applyInvSort(rows);
        const displayRows =
          invPageSize === "All"
            ? sortedRows
            : sortedRows.slice(0, parseInt(invPageSize, 10));

        return `
  ${header("Inventory", "Listahan ng mga Paninda")}
  <main>
    <div class="card">
      <div class="sumline"><span>Total Stock Value (at cost)</span><b>${peso(val.costValue)}</b></div>
      <div class="sumline"><span>Total Potential Sale Value</span><b>${peso(val.saleValue)}</b></div>
      <div class="sumline"><span>Potential Margin if All Sold</span><b class="amt pos">${peso(val.saleValue - val.costValue)}</b></div>
    </div>

    ${
      soon.length > 0
        ? `<div class="card" style="border:1.5px solid var(--ink); background:var(--card);">
      <b style="color:var(--ink);">Expiring within 7 days (${soon.length})</b>
      ${soon
        .sort((a, b) => daysUntil(a.expiryDate) - daysUntil(b.expiryDate))
        .map(
          (r) =>
            `<div class="sumline"><span>${escapeHtml(r.name)}</span><b>${daysUntil(r.expiryDate) < 0 ? "EXPIRED" : daysUntil(r.expiryDate) + "d left"}</b></div>`,
        )
        .join("")}
    </div>`
        : ""
    }

    <div class="search-row">
      <input type="text" id="inv-search-input" placeholder="Search name or code…" value="${escapeHtml(invSearch)}" oninput="setInvSearch(this.value)">
    </div>
    <div class="filter-row">
      <select onchange="setInvCategoryFilter(this.value)">

        ${CATEGORIES.map((c) => `<option value="${c}" ${invCategoryFilter === c ? "selected" : ""}>${c}</option>`).join("")}
      </select>
      <select onchange="setInvStorageFilter(this.value)">
        <option value="All">All Storage</option>
        ${STORAGE_TYPES.map((s) => `<option value="${s}" ${invStorageFilter === s ? "selected" : ""}>${s}</option>`).join("")}
      </select>

      </label>
      <select onchange="setInvPageSize(this.value)" style="flex:1;">
        <option value="10" ${invPageSize === "10" ? "selected" : ""}>Show 10</option>
        <option value="20" ${invPageSize === "20" ? "selected" : ""}>Show 20</option>
        <option value="30" ${invPageSize === "30" ? "selected" : ""}>Show 30</option>
        <option value="All" ${invPageSize === "All" ? "selected" : ""}>Show All</option>
      </select>
    </div>
    
    <div class="filter-row">
    <select onchange="setInvSort(this.value)" style="flex:1;">
    ${invSortOptions()}
    </select>
    </div>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
    <button class="btn" style="flex:1; background:transparent; border:1.5px solid var(--teal); color:var(--teal); padding:10px; font-size:13px;" onclick="exportInventoryCsv()">Export Product List (CSV)</button>
    <button class="btn" style="flex:1; background:transparent; border:1.5px solid var(--brass); color:var(--brass); padding:10px; font-size:13px;" onclick="startCsvImport()">Import CSV</button>
    </div>
    <button class="btn btn-primary" style="margin-bottom:6px;" onclick="openItemModal()">+ Add New Item</button>
  
    <div class="section-title">Item List (${displayRows.length} of ${rows.length})</div>
    ${
      displayRows.length === 0
        ? `<div class="card"><div class="empty">Walang item na tugma.</div></div>`
        : displayRows
            .map((r) => {
              const low = Number(r.stock) <= Number(r.reorder);
              const margin = (Number(r.price) || 0) - (Number(r.cost) || 0);
              const isOpen = expandedItemIdx === r._idx;
              const dLeft = daysUntil(r.expiryDate);
              return `<div class="item-row">
        <div class="item-row-head" onclick="toggleExpand(${r._idx})">
          <div>
            <b>${escapeHtml(r.name)}</b><span class="code-badge">${r.code}</span> ${low ? `<span class="pill overdue">LOW</span>` : ""} ${dLeft !== null && dLeft <= 7 ? `<span class="pill overdue" style="background:var(--bad); color:#fff; border:1px solid #fff;">${dLeft < 0 ? "EXPIRED" : "EXPIRING"}</span>` : ""}
            <div class="meta">Stock: ${r.isComposite ? breakdownStock(r) : `${r.stock} ${r.unit}`} · ${r.category}</div>
          </div>
          <span class="chevron ${isOpen ? "open" : ""}"></span>
        </div>
        ${
          isOpen
            ? `<div class="item-row-body">
          <div class="sumline"><span>Storage Type</span><b>${r.storageType}</b></div>
          <div class="sumline"><span>Expiry Date</span><b>${r.expiryDate || "Not set"}</b></div>
          <div class="sumline"><span>Supplier</span><b>${escapeHtml(r.supplier) || "—"}</b></div>
          ${
            r.isComposite
              ? r.compositeLevels
                  .map(
                    (l) => `
            <div class="sumline"><span>${escapeHtml(l.unit)}${l.forSale ? "" : " (not sold)"}</span><b>${l.forSale ? `${peso(l.cost)} → ${peso(l.price)} (margin ${peso(l.price - l.cost)})` : `cost ${peso(l.cost)}`}</b></div>
          `,
                  )
                  .join("")
              : `
            <div class="sumline"><span>Cost / Unit</span><b>${peso(r.cost)}</b></div>
            <div class="sumline"><span>Sell Price</span><b>${peso(r.price)}</b></div>
            <div class="sumline"><span>Margin / Unit</span><b>${peso(margin)}</b></div>
            ${(() => {
              const pr = Number(r.price) || 0;
              if (pr <= 0) return "";
              const pct = Math.round(((pr - Number(r.cost) || 0) / pr) * 100);
              return `<div class="sumline"><span>Margin %</span><b style="${pct < 10 ? "color:var(--bad)" : ""}">${pct}%${pct < 10 ? " — mababa, presyo review" : ""}</b></div>`;
            })()}
          `
          }
          <div class="sumline"><span>Reorder At</span><b>${r.reorder} ${r.unit}</b></div>
          ${(() => {
            const rate = getDailySellRate(r.name);
            if (rate <= 0) return "";
            const sugg = Math.max(0, Math.ceil(rate * 14 - Number(r.stock)));
            return `<div class="sumline"><span>Suggested Restock (14 days)</span><b>${sugg > 0 ? sugg + " " + r.unit : "Stock OK"}</b></div>`;
          })()}
          ${Number(r.consignmentStock) > 0 ? `<div class="sumline"><span>Consignment Stock (unpaid)</span><b class="amt neg">${r.consignmentStock} ${r.unit}</b></div>` : ""}
          <div class="sumline"><span>Est. Days of Stock Left</span><b>${(() => {
            const rate = getDailySellRate(r.name);
            if (rate <= 0) return "Not enough sales data yet";
            const days = Math.round((Number(r.stock) || 0) / rate);
            return `~${days} day${days === 1 ? "" : "s"}`;
          })()}</b></div>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button class="btn" style="flex:1; background:var(--teal); color:#fff; padding:9px; font-size:13px;" onclick="restockItem(${r._idx})">+ Restock</button>
            <button class="btn" style="flex:1; background:var(--bad); color:#fff; padding:9px; font-size:13px;" onclick="sellItem(${r._idx})">− Sold</button>
          </div>
          <button class="btn" style="width:100%; margin-top:8px; background:transparent; border:1.5px solid var(--ink); color:var(--ink); padding:9px; font-size:13px;" onclick="spoilItem(${r._idx})">Spoiled / Wasted</button>
          <button class="btn" style="width:100%; margin-top:8px; background:transparent; border:1.5px solid var(--brass); color:var(--brass); padding:9px; font-size:13px;" onclick="openItemModal(${r._idx})">Edit Item</button>
          <button class="btn" style="width:100%; margin-top:8px; background:transparent; border:1.5px solid var(--teal); color:var(--teal); padding:9px; font-size:13px;" onclick="openSupplierPriceModal(${r._idx})">Update Supplier Price</button>
          <button class="btn" style="width:100%; margin-top:8px; background:transparent; border:1.5px solid var(--bad); color:var(--bad); padding:9px; font-size:13px;" onclick="delItem('inventory', ${r._idx})">Delete Item</button>
        </div>`
            : ""
        }
      </div>`;
            })
            .join("")
    }

    <button class="btn" style="width:100%; margin-top:8px; background:transparent; border:1.5px solid var(--brass); color:var(--brass);" onclick="goStockHistoryProtected()">View Stock History</button>
  </main>`;
      }

      let invSearchTimer = null;
      function setInvSearch(v) {
        invSearch = v;
        if (invSearchTimer) clearTimeout(invSearchTimer);
        invSearchTimer = setTimeout(() => {
          render();
          const inp = document.getElementById("inv-search-input");
          if (inp) {
            inp.focus();
            inp.setSelectionRange(v.length, v.length);
          }
        }, 250);
      }
      function setInvCategoryFilter(v) {
        invCategoryFilter = v;
        render();
      }
      function setInvStorageFilter(v) {
        invStorageFilter = v;
        render();
      }
      function toggleExpand(i) {
        expandedItemIdx = expandedItemIdx === i ? -1 : i;
        render();
      }
      function setInvLowStockOnly(v) {
        invLowStockOnly = v;
        render();
      }
      function setInvPageSize(v) {
        invPageSize = v;
        render();
      }

      function applyInvSort(rows) {
        const arr = [...rows];
        const marginOf = (r) => (Number(r.price) || 0) - (Number(r.cost) || 0);
        switch (invSort) {
          case "name-desc":
            arr.sort((a, b) => (b.name || "").localeCompare(a.name || ""));
            break;
          case "stock-desc":
            arr.sort((a, b) => (Number(b.stock) || 0) - (Number(a.stock) || 0));
            break;
          case "stock-asc":
            arr.sort((a, b) => (Number(a.stock) || 0) - (Number(b.stock) || 0));
            break;
          case "price-desc":
            arr.sort((a, b) => (Number(b.price) || 0) - (Number(a.price) || 0));
            break;
          case "price-asc":
            arr.sort((a, b) => (Number(a.price) || 0) - (Number(b.price) || 0));
            break;
          case "margin-desc":
            arr.sort((a, b) => marginOf(b) - marginOf(a));
            break;
          case "margin-asc":
            arr.sort((a, b) => marginOf(a) - marginOf(b));
            break;
          default:
            arr.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
        }
        return arr;
      }
      function setInvSort(v) {
        invSort = v;
        render();
      }
      function invSortOptions() {
        const opts = [
          ["name-asc", "Name A–Z"],
          ["name-desc", "Name Z–A"],
          ["stock-desc", "Stock: High → Low"],
          ["stock-asc", "Stock: Low → High"],
          ["price-desc", "Price: High → Low"],
          ["price-asc", "Price: Low → High"],
          ["margin-desc", "Margin: High → Low"],
          ["margin-asc", "Margin: Low → High"],
        ];
        return opts
          .map(
            (o) =>
              `<option value="${o[0]}" ${invSort === o[0] ? "selected" : ""}>${o[1]}</option>`,
          )
          .join("");
      }

          .trim();

      function levDistance(a, b) {
        if (a === b) return 0;

          n = b.length;
        if (!m) return n;
        if (!n) return m;
        let prev = Array.from({ length: n + 1 }, (_, j) => j);
        for (let i = 1; i <= m; i++) {
          const cur = [i];
          for (let j = 1; j <= n; j++) {
            cur[j] = Math.min(
              prev[j] + 1,
              cur[j - 1] + 1,
              prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
            );

      function detectCsvDelimiter(text) {

          bestCount = -1;
        [",", ";", "\t"].forEach((d) => {

            inQ = false;
          for (let i = 0; i < firstLine.length; i++) {
            const ch = firstLine[i];
            if (ch === '"') inQ = !inQ;

            best = d;

      function parseCsv(text, delim) {

      }
      const INV_CSV_COLS = [

        "category",

        "cost",
        "price",
        "stock",
        "reorder",
        "supplier",
        "expiryDate",

      function exportInventoryCsv() {

        const esc = (v) => {
          if (v === null || v === undefined) return "";
          const s = String(v);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        };
        const lines = [INV_CSV_COLS.join(",")];
        state.inventory.forEach((r) =>
          lines.push(INV_CSV_COLS.map((c) => esc(r[c])).join(",")),
        );

          `inventory_template_${ts}.csv`,

      }
      let csvPlan = null;
      function startCsvImport() {
