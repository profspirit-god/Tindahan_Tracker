          const f = e.target.files[0];
          if (!f) return;
          const text = await f.text();
          const rows = parseCsv(text, detectCsvDelimiter(text));
          if (rows.length < 2) {
            alert(
              "CSV walang langan — need a header row plus at least one data row.",
            );
            return;
          }
          let headerIdx = -1;
          for (let i = 0; i < Math.min(rows.length, 10); i++) {
            if (
              rows[i].map((h) => normName(h).replace(/ /g, "")).includes("name")
            ) {
              headerIdx = i;
              break;
            }
          }
          if (headerIdx < 0) {
            alert(
              "Missing required column: name.\nFirst row seen: " +
                (rows[0] || []).slice(0, 6).join(" | ") +
                '\nSave from Excel as "CSV (Comma delimited)" with the header on row 1, or use the Export Product List template.',
            );
            return;
          }
          const header = rows[headerIdx].map((h) =>
            normName(h).replace(/ /g, ""),
          );
          const idxOf = (c) => header.indexOf(c);
          const dataRows = rows.slice(headerIdx + 1).map((r) => {
            const o = {};
            INV_CSV_COLS.forEach((c) => {
              const i = idxOf(c);
              o[c] = i >= 0 ? (r[i] || "").trim() : "";
            });
            return o;
          });
          if (dataRows.length === 0) {
            alert("Header OK but no data rows found below it.");
            return;
          }
          buildCsvPlan(dataRows);
        };
        fileInput.click();
      }
      function computeCsvChanges(e, matchIdx) {
        const it = state.inventory[matchIdx];
        e.kind = "update";
        e.matchIdx = matchIdx;
        e.changes = [];
        ["category", "storageType", "unit", "supplier", "expiryDate"].forEach(
          (f) => {
            const v = e.row[f];
            if (v === "CLEAR") {
              if (String(it[f] || "") !== "")
                e.changes.push({
                  field: f,
                  old: String(it[f] || ""),
                  new: "",
                  raw: "",
                });
              return;
            }
            if (!v) return;
            if (String(it[f] || "") !== v)
              e.changes.push({
                field: f,
                old: String(it[f] || ""),
                new: v,
                raw: v,
              });
          },
        );
        ["cost", "price", "stock", "reorder"].forEach((f) => {
          const v = e.row[f];
          if (v === "") return;
          if (v === "CLEAR") {
            if (Number(it[f] || 0) !== 0)
              e.changes.push({
                field: f,
                old: String(it[f] || 0),
                new: "0",
                raw: 0,
              });
            return;
          }
          const nv = Number(v);
          if (isNaN(nv)) {
            e.kind = "error";
            e.reason = "Bad number in " + f;
            return;
          }
          if (Number(it[f] || 0) !== nv)
            e.changes.push({
              field: f,
              old: String(it[f] || 0),
              new: String(nv),
              raw: nv,
            });
        });
        if (e.kind === "update" && e.changes.length === 0) {
          e.kind = "skip";
        }
      }
      function applyCsvField(it, f, raw) {
        it[f] = raw;
        if (
          (f === "cost" || f === "price") &&
          it.isComposite &&
          it.compositeLevels &&
          it.compositeLevels.length
        ) {
          it.compositeLevels[it.compositeLevels.length - 1][f] = raw;
        }
      }
      function buildCsvPlan(dataRows) {
        const entries = [];
        dataRows.forEach((row, ri) => {
          const e = {
            idx: ri + 2,
            row,
            kind: null,
            chosen: null,
            members: null,
          };
          if (!row.name) {
            e.kind = "error";
            e.reason = "Missing name";
            entries.push(e);
            return;
          }
          const badNum = ["cost", "price", "stock", "reorder"].find(
            (f) => row[f] !== "" && row[f] !== "CLEAR" && isNaN(Number(row[f])),
          );
          if (badNum) {
            e.kind = "error";
            e.reason = "Bad number in " + badNum;
            entries.push(e);
            return;
          }
          const codeMatch = row.code
            ? state.inventory.findIndex((it) => it.code === row.code)
            : -1;
          const nn = normName(row.name);
          const exactMatch =
            codeMatch >= 0
              ? codeMatch
              : state.inventory.findIndex((it) => normName(it.name) === nn);
          if (exactMatch >= 0) {
            computeCsvChanges(e, exactMatch);
            if (e.kind !== "skip") entries.push(e);
            return;
          }
          let best = -1,
            bestD = 99;
          state.inventory.forEach((it, ii) => {
            const d = levDistance(nn, normName(it.name));
            if (d < bestD) {
              bestD = d;
              best = ii;
            }
          });
          if (best >= 0 && bestD <= fuzzyThreshold(nn)) {
            e.kind = "create";
            entries.push({
              kind: "conflict",
              ctype: "fuzzy",
              matchIdx: best,
              members: [e],
              chosen: null,
              row,
              reason: `Similar existing item: "${state.inventory[best].name}" (${bestD} edit${bestD === 1 ? "" : "s"} away).`,
              detail:
                "Merge updates the existing item; Create adds a new product.",
              options: [
                "Merge into " + state.inventory[best].name,
                "Create as separate",
              ],
            });
            entries.push(e);
            return;
          }
          e.kind = "create";
          entries.push(e);
        });
        const creates = entries.filter((x) => x.kind === "create");
        const clusters = [];
        creates.forEach((c) => {
          const nn = normName(c.row.name);
          let host = clusters.find(
            (cl) =>
              cl.nn === nn || levDistance(nn, cl.nn) <= fuzzyThreshold(nn),
          );
          if (!host) {
            host = { nn, members: [] };
            clusters.push(host);
          }
          host.members.push(c);
        });
        clusters.forEach((cl) => {
          if (cl.members.length > 1) {
            entries.push({
              kind: "conflict",
              ctype: "dupcreate",
              members: cl.members,
              chosen: null,
              row: cl.members[0].row,
              reason: `${cl.members.length} CSV rows look like the same product.`,
              detail: cl.members
                .map((m) => "row " + m.idx + ": " + m.row.name)
                .join(" | "),
              options: ["Keep last", "Keep first", "Create both"],
            });
          }
        });
        const byMatch = {};
        entries
          .filter((x) => x.kind === "update")
          .forEach((u) => {
            (byMatch[u.matchIdx] = byMatch[u.matchIdx] || []).push(u);
          });
        Object.values(byMatch).forEach((group) => {
          if (group.length > 1) {
            entries.push({
              kind: "conflict",
              ctype: "dupupdate",
              members: group,
              chosen: null,
              row: group[0].row,
              reason: "Two CSV rows update the same existing item.",
              detail: group.map((m) => "row " + m.idx).join(" | "),
              options: ["Keep last", "Keep first"],
            });

        renderCsvReview();
      }
      function renderCsvReview() {
        const sheet = document.getElementById("item-modal-sheet");
        const p = csvPlan;

        const updates = p.entries.filter((x) => x.kind === "update");
        const conflicts = p.entries.filter((x) => x.kind === "conflict");
        const errors = p.entries.filter((x) => x.kind === "error");
        sheet.innerHTML = `
<div class="modal-title-row"><h3>CSV Import Review</h3><button class="modal-x" aria-label="Close" onclick="closeItemModal()"></button></div>
<p class="subtitle">Create ${creates.length} · Update ${updates.length} · Needs decision ${conflicts.length} · Errors ${errors.length}</p>
${
  conflicts.length
    ? `<div class="section-title">Needs your decision</div>` +
      conflicts
        .map(
          (c, ci) => `
<div class="card" style="padding:12px; margin-bottom:8px;">
<b>${escapeHtml(c.row.name)}</b>
<div class="meta" style="margin:4px 0 2px;">${escapeHtml(c.reason)}</div>
<div class="meta" style="margin:0 0 8px;">${escapeHtml(c.detail || "")}</div>
<div style="display:flex; gap:6px; flex-wrap:wrap;">
${c.options.map((o, oi) => `<button class="btn" style="padding:7px 10px; font-size:12px; background:${c.chosen === oi ? "var(--teal)" : "var(--page-line)"}; color:${c.chosen === oi ? "#fff" : "var(--ink)"};" onclick="resolveCsvConflict(${ci}, ${oi})">${escapeHtml(o)}</button>`).join("")}

${

${creates.length ? `<div class="section-title">New items</div><div class="card">` + creates.map((c) => `<div class="sumline"><span>${escapeHtml(c.row.name)}</span><b>${escapeHtml(c.row.category || "Other")}</b></div>`).join("") + `</div>` : ""}
${errors.length ? `<div class="section-title">Errors (skipped)</div><div class="card">` + errors.map((er) => `<div class="sumline"><span>${escapeHtml(er.row.name || "row " + er.idx)}</span><b style="color:var(--bad);">${escapeHtml(er.reason)}</b></div>`).join("") + `</div>` : ""}
<button class="btn btn-primary" onclick="applyCsvPlan()">Confirm Import</button>
`;
        document.getElementById("item-modal-overlay").classList.add("open");

      function resolveCsvConflict(ci, oi) {

      function applyCsvPlan() {
        const p = csvPlan;
        const conflicts = p.entries.filter((x) => x.kind === "conflict");
        if (
          conflicts.some((c) => c.chosen === null || c.chosen === undefined)
        ) {
          alert('Resolve all "Needs decision" cards first.');
          return;
        }
        const drop = new Set();
        conflicts.forEach((c) => {
          if (c.ctype === "fuzzy") return;
          const n = c.members.length;
          let keep = null;
          if (c.options[c.chosen] === "Keep last") keep = n - 1;
          else if (c.options[c.chosen] === "Keep first") keep = 0;
          if (keep === null) return;
          c.members.forEach((m, mi) => {
            if (mi !== keep) drop.add(m);

        const snapshot = JSON.parse(JSON.stringify(state));
        let created = 0,
          updated = 0;
        p.entries.forEach((e) => {
          if (drop.has(e)) return;
          if (e.kind === "create") {
            const cat =
              e.row.category && CATEGORIES.includes(e.row.category)
                ? e.row.category
                : "Other";
            const it = {
              name: e.row.name,
              category: cat,
              storageType:
                e.row.storageType && STORAGE_TYPES.includes(e.row.storageType)
                  ? e.row.storageType
                  : "Dry",
              unit: e.row.unit || "pcs",
              supplier: e.row.supplier || "",

              compositeLevels: null,

      // As of v28.2.1, ALL quantity entry (simple or composite) goes through the

      function restockItem(i) {

      }

      }
      function spoilItem(i) {

      }

      function applyStockDelta(idx, action, baseAmt, unitLabel, source) {
        const item = state.inventory[idx];
        const oldStock = Number(item.stock) || 0;
        const qtyChange = action === "restock" ? baseAmt : -baseAmt;
        const newStock =
          action === "restock"
            ? oldStock + baseAmt
            : Math.max(0, oldStock - baseAmt);
        const actionLabel =
          action === "restock"
            ? "Restock"
            : action === "sell"
              ? "Sold/Used"
              : "Spoiled/Wasted";

        if (action === "restock" && source === "consignment") {
          item.consignmentStock =
            (Number(item.consignmentStock) || 0) + baseAmt;
        } else if (action !== "restock") {
          const removed = oldStock - newStock;
          const consignUsed = Math.min(
            Number(item.consignmentStock) || 0,
            removed,
          );
          if (consignUsed > 0) {
            item.consignmentStock =
              (Number(item.consignmentStock) || 0) - consignUsed;
            const payable = getConsignmentPayableForItem(item.code);
            if (payable) {
              const accrue =
                action === "sell" ||
                (action === "spoil" && payable.chargeForSpoilage);
              if (accrue) {
                if (!payable.history) payable.history = [];
                payable.history.push({
                  date: todayStr(),
                  amount: consignUsed * (Number(item.cost) || 0),
                  kind: action === "sell" ? "sale-accrual" : "spoilage-accrual",
                  by: currentUser,
                  note: `${item.name} × ${consignUsed}`,

              }

          }
        }

        logStockChange(
          item.name,
          unitLabel
            ? `${actionLabel} (${unitLabel})${source === "consignment" ? " [Consignment]" : ""}`
            : actionLabel,
          qtyChange,
          oldStock,
          newStock,
        );
        item.stock = newStock;
        saveState();
        closeItemModal();
        render();
      }

      function openQtyModal(itemIdx, action) {
        const item = state.inventory[itemIdx];
        const titleMap = {
          restock: "Restock",
          sell: "Sold / Used",
          spoil: "Spoiled / Wasted",
        };
        const sheet = document.getElementById("item-modal-sheet");
        const consignPayable =
          action === "restock" ? getConsignmentPayableForItem(item.code) : null;
        const unitOptions = item.isComposite
          ? item.compositeLevels
              .map(
                (l, i) => `<option value="${i}">${escapeHtml(l.unit)}</option>`,

        sheet.innerHTML = `
    <div class="modal-title-row"><h3>${titleMap[action]} — ${escapeHtml(item.name)}</h3><button class="modal-x" aria-label="Close" onclick="closeItemModal()"></button></div>
    <label>Unit</label>
    <select id="qty-unit">${unitOptions}</select>
    <label>Quantity</label>
    <input type="number" id="qty-amount" placeholder="0">
    ${

        ? `
      <label>Stock Source — Pinagmulan ng Stock</label>
      <select id="qty-source">
        <option value="owned">Owned — Binayaran na</option>

      function submitQtyModal(itemIdx, action) {
        const item = state.inventory[itemIdx];
        const levelIdx = parseInt(
          document.getElementById("qty-unit").value,
          10,
        );
        const amt = parseFloat(document.getElementById("qty-amount").value);
        if (isNaN(amt) || amt <= 0) {
          alert("Please enter a valid amount.");
          return;
        }
        const baseAmt = item.isComposite
          ? amt * unitsPerBase(item.compositeLevels, levelIdx)
          : amt;
        const unitLabel = item.isComposite
          ? `${amt} ${item.compositeLevels[levelIdx].unit}`
          : `${amt} ${item.unit}`;
        const sourceEl = document.getElementById("qty-source");
        applyStockDelta(
          itemIdx,
          action,
          baseAmt,
          unitLabel,
          sourceEl ? sourceEl.value : undefined,
        );
      }

      function getInventoryValue() {
        return state.inventory.reduce(
          (acc, r) => {
            const stock = Number(r.stock) || 0;
            acc.costValue += stock * (Number(r.cost) || 0);
            acc.saleValue += stock * (Number(r.price) || 0);
            return acc;
          },
          { costValue: 0, saleValue: 0 },
        );
      }

      function getDailySellRate(itemName, windowDays) {
        windowDays = windowDays || 14;
        const cutoff = Date.now() - windowDays * 86400000;
        const sold = (state.stockHistory || []).filter(
          (h) =>
            h.item === itemName &&
            h.action === "Sold/Used" &&
            new Date(h.time).getTime() >= cutoff,
        );
        if (sold.length === 0) return 0;
        const totalQty = sold.reduce(
          (s, h) => s + Math.abs(h.qtyChange || 0),
          0,
        );
        return totalQty / windowDays;
      }

      function logStockChange(itemName, action, qtyChange, oldStock, newStock) {
        if (!state.stockHistory) state.stockHistory = [];
        state.stockHistory.push({
          item: itemName,
          action,
          qtyChange,
          oldStock,
          newStock,
          by: currentUser || "Unknown",
          time: new Date().toISOString(),
        });
      }

      function unitsPerBase(levels, idx) {
        let units = 1;
        for (let i = idx; i < levels.length - 1; i++) {
          units *= Number(levels[i].multiplier) || 1;
        }
        return units;
      }

      function breakdownStock(item) {
        if (!item.isComposite) return `${item.stock} ${item.unit}`;
        let remaining = Number(item.stock) || 0;
        const parts = [];
        for (let i = 0; i < item.compositeLevels.length; i++) {
          const per = unitsPerBase(item.compositeLevels, i);
          const count = Math.floor(remaining / per);
          if (count > 0) {
            parts.push(
              `${count} ${item.compositeLevels[i].unit}${count !== 1 ? "s" : ""}`,
            );
            remaining -= count * per;
          }
        }
        return parts.length === 0
          ? `0 ${item.compositeLevels[item.compositeLevels.length - 1].unit}`
          : parts.join(", ");
      }

      function renderLevelsUI() {
        const container = document.getElementById("im-levels-container");
        if (!container) return;
        container.innerHTML = modalCompositeLevels

      function saveItemForm() {
        if (!requireOwner()) return;
        const name = document.getElementById("im-name").value.trim();
        if (!name) {
          alert("Item name is required.");
          return;
        }
        const category = document.getElementById("im-category").value;

        const data = {

      const ACTION_MAP = {
        "A-Fast": "Stock Up",
        "A-Slow": "Investigate",
        "A-Dead": "Urgent Review",
        "B-Fast": "Maintain",
        "B-Slow": "Monitor",
        "B-Dead": "Consider Drop",
        "C-Fast": "Maintain (small qty)",
        "C-Slow": "Consider Drop/Clearance",
        "C-Dead": "Drop",
      };

      function getInventoryHealthData() {
        const cutoff15 = Date.now() - 15 * 86400000;
        const cutoff45 = Date.now() - 45 * 86400000;

        const stats = state.inventory.map((it) => {
          const soldEntries = (state.stockHistory || []).filter(
            (h) =>
              h.item === it.name && h.action && h.action.startsWith("Sold"),
          );
          const sold15 = soldEntries.filter(
            (h) => new Date(h.time).getTime() >= cutoff15,
          );
          const qty15 = sold15.reduce(
            (s, h) => s + Math.abs(h.qtyChange || 0),
            0,
          );
          const revenue15 = qty15 * (Number(it.price) || 0);
          const lastSoldTime = soldEntries.length
            ? Math.max(...soldEntries.map((h) => new Date(h.time).getTime()))
            : null;
          const isDead = !lastSoldTime || lastSoldTime < cutoff45;
          const rate = qty15 / 15;
          const daysLeft = rate > 0 ? (Number(it.stock) || 0) / rate : null;
          let movement;
          if (isDead) movement = "Dead";
          else if (daysLeft !== null && daysLeft < 15) movement = "Fast";
          else movement = "Slow";
          return { item: it, revenue15, movement };
        });

        const totalRevenue = stats.reduce((s, r) => s + r.revenue15, 0);
        const sorted = [...stats].sort((a, b) => b.revenue15 - a.revenue15);
        let cum = 0;
        sorted.forEach((r) => {
          cum += r.revenue15;
          const pct = totalRevenue > 0 ? cum / totalRevenue : 1;
          r.tier = pct <= 0.8 ? "A" : pct <= 0.95 ? "B" : "C";
        });
        return stats;
      }

      function getGMROI(sel) {
        const sum = getMonthSummary(sel);
        const val = getInventoryValue();
        if (val.costValue <= 0) return null;
        return sum.opResult / val.costValue;
      }

      function renderHealthMatrix() {
        const stats = getInventoryHealthData();
        const tiers = ["A", "B", "C"],
          moves = ["Fast", "Slow", "Dead"];
        const colorFor = (m) =>
          m === "Fast"
            ? "var(--good-bg)"
            : m === "Dead"
              ? "var(--bad-bg)"
              : "var(--page-line)";
        let html = `<div style="display:grid; grid-template-columns:36px repeat(3,1fr); gap:6px; font-size:12px;">

        tiers.forEach((t) => {
          html += `<div style="font-weight:700; display:flex; align-items:center;">${t}</div>`;
          moves.forEach((m) => {
            const count = stats.filter(
              (r) => r.tier === t && r.movement === m,
            ).length;
            html += `<div onclick="openMatrixCell('${t}','${m}')" style="background:${colorFor(m)}; border-radius:8px; text-align:center; padding:14px 4px; font-weight:700; cursor:pointer;">${count}</div>`;

        return html;

      function submitSupplierPrice(itemIdx) {
        if (!requireOwner()) return;

      function daysUntil(dateStr) {
        if (!dateStr) return null;
        const today = new Date(todayStr());
        const target = new Date(dateStr);
        return Math.round((target - today) / 86400000);
      }

      function getMonthSummary(sel) {
        const dRows = state.dailyLogs.filter((r) => monthKey(r.date) === sel);
        const salesIn = dRows.reduce((s, r) => s + (r.salesIn || 0), 0);
        const purchOut = dRows.reduce((s, r) => s + (r.purchOut || 0), 0);
        const feeIn = dRows.reduce((s, r) => s + (r.fee || 0), 0);
        const movedOut = dRows.reduce((s, r) => s + (r.movedDraw || 0), 0);
        const opResult = salesIn + feeIn - purchOut;
        const householdTotal = state.household.reduce(
          (s, h) => s + (Number(h.budget) || 0),
          0,
        );
        const net = opResult - movedOut; // actual draw (cash truth)
        const netPlanned = opResult - householdTotal; // budget-based reference
        const unpaidTotal = state.payables.reduce(
          (s, p) => s + getPayableBalance(p),
          0,
        );
        return {
          salesIn,
          purchOut,
          feeIn,
          movedOut,
          opResult,
          householdTotal,
          net,
          netPlanned,
          unpaidTotal,
        };
      }

      function getExpansionInsights(sel) {
        const rows = (state.expansionLog || [])
          .filter((r) => monthKey(r.date) === sel)
          .sort((a, b) => a.date.localeCompare(b.date));
        let running = 0;
        const cumulative = rows.map((r) => {
          running += r.amt;
          return { date: r.date, cumulative: running };
        });
        const total = rows.reduce((s, r) => s + (r.amt || 0), 0);
        return { rows, cumulative, total };
      }

      function renderSummary() {
        const now = new Date();
        const defaultMonth = now.toISOString().slice(0, 7);
        const sel = window._selMonth || defaultMonth;
        const dRows = state.dailyLogs.filter((r) => monthKey(r.date) === sel);
        const salesIn = dRows.reduce((s, r) => s + (r.salesIn || 0), 0);
        const purchOut = dRows.reduce((s, r) => s + (r.purchOut || 0), 0);
        const feeIn = dRows.reduce((s, r) => s + (r.fee || 0), 0);
        const movedOut = dRows.reduce((s, r) => s + (r.movedDraw || 0), 0);
        const opResult = salesIn + feeIn - purchOut;
        const householdTotal = state.household.reduce(
          (s, h) => s + (Number(h.budget) || 0),
          0,
        );
        const net = opResult - movedOut; // actual draw (cash truth)
        const netPlanned = opResult - householdTotal;
        const unpaidTotal = state.payables.reduce(
          (s, p) => s + getPayableBalance(p),
          0,
        );
        const monthOptions = buildMonthOptions(sel);

        return `
  ${header("Monthly Summary", "Buod ng Buwan", true)}
  <main>
    <label>Select Month</label>
    <select id="sum-month" onchange="changeMonth(this.value)">${monthOptions}</select>
    <div class="card" style="margin-top:14px;">
      <div class="sumline"><span>Sales In</span><b class="amt pos">${peso(salesIn)}</b></div>

      }

      function getDailyIncomeExpense(sel) {
        const rows = state.dailyLogs.filter((r) => monthKey(r.date) === sel);
        const byDate = {};
        rows.forEach((r) => {
          if (!byDate[r.date])
            byDate[r.date] = { date: r.date, income: 0, expense: 0, sales: 0 };
          byDate[r.date].income += (r.salesIn || 0) + (r.fee || 0);
          byDate[r.date].expense += r.purchOut || 0;
          byDate[r.date].sales += r.salesIn || 0;
        });
        return Object.values(byDate)
          .map((d) => ({ ...d, net: d.income - d.expense }))
          .sort((a, b) => a.date.localeCompare(b.date));
      }

      function getHouseholdByCategory(sel) {
        const totals = {};
        (state.householdHistory || []).forEach((h) => {
          if (h.field !== "actual") return;
          if ((h.time || "").slice(0, 7) !== sel) return;
          const delta = (h.newVal || 0) - (h.oldVal || 0);
          totals[h.cat] = (totals[h.cat] || 0) + delta;
        });
        return Object.entries(totals)
          .map(([cat, total]) => ({ cat, total }))
          .filter((r) => r.total !== 0);
      }
      let incomeExpenseChart = null;
      let householdPieChart = null;
      let expansionChart = null;
      let salesCompareChart = null;
      let rankMetric = "income";
      let rankOrder = "desc";
      let hhRankOrder = "desc";

      function renderInsights() {
        const now = new Date();
        const defaultMonth = now.toISOString().slice(0, 7);
        const sel = window._selMonth || defaultMonth;
        const monthOptions = buildMonthOptions(sel);
        const daily = getDailyIncomeExpense(sel);
        const household = getHouseholdByCategory(sel);
        const prevSel = prevMonthKey(sel);
        const [py, pm] = prevSel.split("-");
        const prevLabel = `${MONTHS[parseInt(pm, 10) - 1]} ${py}`;
        const curSum = getMonthSummary(sel);
        const prevSum = getMonthSummary(prevSel);
        const momRevenue =
          curSum.salesIn + curSum.feeIn - (prevSum.salesIn + prevSum.feeIn);
        const momNet = curSum.net - prevSum.net;
        return `
  ${header("Insights", "Mga Tsart at Ranggo", true)}
  <main>
    <label>Select Month</label>
    <select id="ins-month" onchange="changeMonth(this.value)">${monthOptions}</select>
    <div class="card" style="margin-top:14px;">
    <div class="sumline"><span>Revenue vs ${prevLabel}</span><b class="${momRevenue >= 0 ? "amt pos" : "amt neg"}">${momRevenue >= 0 ? "+" : ""}${peso(momRevenue)}</b></div>
    <div class="sumline"><span>Net vs ${prevLabel}</span><b class="${momNet >= 0 ? "amt pos" : "amt neg"}">${momNet >= 0 ? "+" : ""}${peso(momNet)}</b></div>
    </div>
    <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
    Sales Day-by-Day: This Month vs ${prevLabel}
    <button class="btn" style="background:var(--teal); color:#fff; padding:6px 12px; font-size:12px;" onclick="expandChart('salesCompare')">Expand</button>
    </div>
    <div class="card"><canvas id="salesCompareCanvas" height="220"></canvas></div>
    <div class="section-title" style="margin-top:16px; display:flex; justify-content:space-between; align-items:center;">
    Revenue, Expenses & Profit
      <button class="btn" style="background:var(--teal); color:#fff; padding:6px 12px; font-size:12px;" onclick="expandChart('income')">Expand</button>
    </div>
    <div class="card"><canvas id="incomeExpenseCanvas" height="220"></canvas></div>

    <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
      Household Spending by Category
      <button class="btn" style="background:var(--teal); color:#fff; padding:6px 12px; font-size:12px;" onclick="expandChart('household')">Expand</button>
    </div>
    <div class="card"><canvas id="householdPieCanvas" height="220"></canvas></div>

    <div class="section-title">Daily Ranking</div>
    <div class="card">
      <div class="row2">
        <select onchange="setRankMetric(this.value)">
          <option value="income" ${rankMetric === "income" ? "selected" : ""}>Income</option>
          <option value="expense" ${rankMetric === "expense" ? "selected" : ""}>Store Expense</option>
          <option value="net" ${rankMetric === "net" ? "selected" : ""}>Net</option>
        </select>
        <select onchange="setRankOrder(this.value)">
          <option value="desc" ${rankOrder === "desc" ? "selected" : ""}>Highest first</option>
          <option value="asc" ${rankOrder === "asc" ? "selected" : ""}>Lowest first</option>
        </select>
      </div>
      <div style="margin-top:10px;">${renderDailyRanking(daily)}</div>
    </div>

    <div class="section-title">Household Category Ranking</div>
    <div class="card">
      <div class="row2">
        <select onchange="setHhRankOrder(this.value)">
          <option value="desc" ${hhRankOrder === "desc" ? "selected" : ""}>Highest first</option>
          <option value="asc" ${hhRankOrder === "asc" ? "selected" : ""}>Lowest first</option>
        </select>
      </div>
      <div style="margin-top:10px;">${renderHouseholdRanking(household)}</div>
    </div>

    <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
      Business Expansion (Stall) Spending
      <button class="btn" style="background:var(--teal); color:#fff; padding:6px 12px; font-size:12px;" onclick="expandChart('expansion')">Expand</button>
    </div>
    <div class="card">
      <div class="sumline"><span>Total This Month</span><b class="amt neg">${peso(getExpansionInsights(sel).total)}</b></div>
      <canvas id="expansionCanvas" height="180" style="margin-top:10px;"></canvas>
    </div>
    <div class="section-title" style="margin-top:20px;">Inventory Health Matrix</div>
    <div class="card">
      <div class="sumline"><span>GMROI (Profit ÷ Stock Value)</span><b>${(() => {
        const g = getGMROI(sel);
        return g === null ? "Not enough data" : `${g.toFixed(2)}x`;
      })()}</b></div>
      <p class="subtitle" style="margin:6px 0 0;">Above 1x = your stock investment is generating more profit than it costs to hold.</p>
    </div>
    <div class="card">
      ${renderHealthMatrix()}
      <p class="subtitle" style="margin-top:10px;">Tap any cell to see which items landed there.</p>
    </div>
  </main>`;
      }

      function setRankMetric(v) {
        rankMetric = v;
        render();
      }
      function setRankOrder(v) {
        rankOrder = v;
        render();
      }
      function setHhRankOrder(v) {
        hhRankOrder = v;
        render();
      }

      function metricColorClass(metric, value) {
        if (metric === "expense") return "amt neg";
        if (metric === "income") return "amt pos";
        return value >= 0 ? "amt pos" : "amt neg";
      }

      function renderDailyRanking(daily) {
        const sorted = [...daily].sort((a, b) =>
          rankOrder === "desc"
            ? b[rankMetric] - a[rankMetric]
            : a[rankMetric] - b[rankMetric],
        );
        if (sorted.length === 0)
          return `<div class="empty">Wala pang data ngayong buwan.</div>`;
        return sorted
          .map(
            (d) =>
              `<div class="sumline"><span>${d.date}</span><b class="${metricColorClass(rankMetric, d[rankMetric])}">${peso(d[rankMetric])}</b></div>`,
          )
          .join("");
      }

      function renderHouseholdRanking(household) {
        const sorted = [...household].sort((a, b) =>
          hhRankOrder === "desc" ? b.total - a.total : a.total - b.total,
        );
        if (sorted.length === 0)
          return `<div class="empty">Wala pang gastos na naka-record ngayong buwan.</div>`;
        return sorted
          .map(
            (h) =>
              `<div class="sumline"><span>${escapeHtml(h.cat)}</span><b>${peso(h.total)}</b></div>`,
          )
          .join("");
      }

      function destroyInsightCharts() {

          incomeExpenseChart.destroy();
          incomeExpenseChart = null;

        if (householdPieChart) {
          householdPieChart.destroy();
          householdPieChart = null;
        }
        if (expansionChart) {
          expansionChart.destroy();

        }

          modalChart = null;
        }
      }

      function buildMonthOptions(sel) {
        const set = new Set(
          state.dailyLogs.map((r) => monthKey(r.date)).filter(Boolean),
        );
        set.add(sel);
        const arr = Array.from(set).sort().reverse();
        return arr
          .map((m) => {
            const [y, mo] = m.split("-");
            const label = `${MONTHS[parseInt(mo, 10) - 1]} ${y}`;
            return `<option value="${m}" ${m === sel ? "selected" : ""}>${label}</option>`;
          })
          .join("");

      function renderHelp() {
        const tips = [
          "Fill in the Daily Entry every night before closing — it only takes 5 minutes and it's the single habit that fixes everything else.",
          "Never spend GCash float money on store stock, and never spend store sales money to top up GCash float. If you use GCash to pay a supplier, log it as a Stock Purchase in Daily Entry, not as GCash Cash-Out.",
          "Move money to 'Household' once, on a set schedule, instead of taking small amounts whenever needed.",

          "When a supplier panel arrives unannounced, check Utang/Loans first before saying yes to a non-essential restock.",
          "Check Store Health together as a family regularly — it's meant to start a conversation, not to blame anyone.",

        return `
  ${header("Help & Tips", "Gabay sa Paggamit", true)}
  <main>
    <div class="banner">This app is shared — anyone in the family who opens it sees the same records. There's no password beyond the PIN, so only share it with family.</div>

    <div class="help-h">Pagpasok sa App (Getting In)</div>
    <p class="help-p"><b>PIN</b> — enter the family PIN once per device; it's remembered after that.</p>

    <p class="help-p">Tap the menu button (top-left) anytime to open the menu — your name, Store Health, and all 7 tools are listed there. Tap outside the menu, or tap a tool, to close it. At the bottom of the menu: <b>Text Size</b> (larger type) and <b>Motion</b> (removes animations) toggles — nai-save per device, para mas komportable sa mata.</p>

    <div class="help-h">Paano Gamitin ang Bawat Tool</div>
    <p class="help-p"><b>Store Health</b> — ang unang makikita mo. Buod ng kita, gastos, at kung kumikita ang tindahan ngayong buwan, kasama ang paalala kung may mababang stock, malapit nang mag-expire, o may dapat bayarang utang. Dalawang numero ng net ang makikita mo: <b>Net After Actual Draw</b> (base sa talagang kinuha para sa bahay — dito base ang stamp) at <b>Net If Full Budget Drawn</b> (kung kukunin ang buong budget). Kung malayo ang pagkakaiba, tandaan na may naiwan o nadagdag sa supot ng bahay.</p>

    <p class="help-p"><b>Household Budget</b> — '+ Add' kapag may bagong gastos, '− Fix' kung mali ang nailagay, para tanggalin ang kategorya. May History button na protektado ng sariling passkey.</p>
    <p class="help-p"><b>Utang / Loans</b> — bawat may utang na supplier o pautang, ilista dito para may paalala ang due date.</p>
    <p class="help-p"><b>Suki Utang (Receivables)</b> — pera na owed sa tindahan ng suki. I-log ang partial payments habang nagbabayad sila; may paalala kapag lampas na sa promised date. Hindi ito kasama sa Revenue hangga't hindi pa nakukolekta — hiwalay ito sa mga supot ng pera.</p>
    <p class="help-p"><b>Inventory</b> — hanapin gamit ang search o i-filter ayon sa Category/Storage Type. I-tap ang isang item para makita ang detalye at ma-restock, mabenta, o maireport na sira. May babala din kung malapit nang mag-expire.</p>
    <p class="help-p"><b>Insights</b> — mga tsart ng Revenue/Expenses/Profit at gastos sa bahay, plus ranggo ng araw at kategorya mula pinakamataas hanggang pinakamababa.</p>

    <div class="help-h">Data Tools</div>
    <p class="help-p"><b>Download Summary (Word)</b> — buod ng buwan na pwedeng i-print o ipadala.</p>
    <p class="help-p"><b>Reset for a Clean Slate</b> — buburahin ang Daily Entries, GCash, at Loans; hindi kasama ang Top Items.</p>
    
    <div class="help-h">Bulk Inventory (CSV)</div>
    <p class="help-p"><b>Export Product List (CSV)</b> — buksan sa Excel, i-edit ang presyo o stock, save, then <b>Import CSV</b>. Blank cell = walang babaguhin; CLEAR = burahin ang field. Bago ma-apply, makikita mo muna ang review: Create / Update / Needs decision / Errors. Ang magkakaparehong pangalan (kahit mali ang spelling) ay itatanong muna bago gagawin.</p>
    <div class="help-h">People & Roles</div>
<p class="help-p"><b>People & Roles</b> — Owner ang nakakakita ng lahat (kita, household, Data Tools, Audit). Staff: Today's Entry, GCash, Inventory operations, Suki Utang, at Settings comfort lang. Bawat tao may sariling 4-digit code; hash lang ang naka-store, hindi plaintext.</p>
<p class="help-p"><b>Audit Log</b> — owner-only list kung sino ang gumawa ng ano (delete, edit, payment, import, reset), may old → new values. Last 400 actions; may CSV export.</p>
    <div class="help-h">Settings</div>
<p class="help-p"><b>Settings</b> — buksan ang menu at pindutin ang Settings: Text Size, Dark Mode, Reduced Motion, Always Show Input Hints, at Auto-lock time. Naka-save per device ang bawat setting.</p>
<p class="help-p"><b>PIN lockout</b> — pag mali ang PIN ng 3 beses, may countdown (60s, mas matagal kapag inulit) bago makasubok ulit.</p>
<p class="help-p"><b>Info icons</b> — ang bilog na "i" sa tabi ng ilang field ay pwedeng i-tap para sa mabilisang paliwanag; o i-on ang Always Show Input Hints kung gusto ng buong teksto palagi.</p>
    <div class="help-h">Tips</div>
    ${tips.map((t) => `<div class="tip">${t}</div>`).join("")}
  </main>`;
      }

      function delItem(key, idx) {
        if (idx < 0) return;
        if (
          (key === "payables" ||
            key === "receivables" ||
            key === "inventory" ||
            key === "suppliers") &&
          !requireOwner()
        )
          return;
        const ok = confirm(
          "Sigurado ka ba? Tatanggalin ito. \n\nAre you sure? This will delete this entry.",
        );
        if (!ok) return;
        const item = JSON.parse(JSON.stringify(state[key][idx]));
        pushUndo({
          type: "delete-row",
          label: `Restore ${key}`,
          key,
          idx,
          item,
        });
        logAudit(
          "delete",
          key + "[" + idx + "]",
          JSON.stringify(item).slice(0, 120),
          "",
        );
        state[key].splice(idx, 1);
        saveState();
        render();
      }
      function escapeHtml(s) {
        if (!s) return "";
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }
      function attachHandlers() {
        /* all handlers are inline via onclick for simplicity/reliability */
      }

      // --- Inactivity auto-lock (v28.2.3) ---
      // Shared family phones get left unlocked on the counter; the PIN must re-engage.
      let INACTIVITY_LOCK_MS = 15 * 60 * 1000; // default; Settings can override per device
      let inactivityTimer = null;

      function lockAppForInactivity() {
        const ls = document.getElementById("lock-screen");
        if (ls && ls.style.display !== "none") return; // already on the lock screen
        localStorage.removeItem("storeUnlocked");
        ls.style.display = "flex";
        const li = document.getElementById("lock-input");
        if (li) li.value = "";
        const le = document.getElementById("lock-error");
        if (le)
          le.textContent =
            "Auto-locked after inactivity — enter the PIN again.";
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("sidebar-overlay").classList.remove("open");
        document.getElementById("item-modal-overlay").classList.remove("open");
        document.getElementById("chart-modal").classList.remove("open");
      }

      function resetInactivityTimer() {
        if (inactivityTimer) clearTimeout(inactivityTimer);
        inactivityTimer = setTimeout(lockAppForInactivity, INACTIVITY_LOCK_MS);
      }

      ["touchstart", "click", "keydown", "scroll"].forEach((evt) => {
        document.addEventListener(evt, resetInactivityTimer, { passive: true });
      });
      function toggleBigText() {
        const on = document.body.classList.toggle("big-text");
        localStorage.setItem("storeBigText", on ? "1" : "0");
        render();
      }
      function toggleMotion() {
        const on = document.body.classList.toggle("no-motion");
        localStorage.setItem("storeNoMotion", on ? "1" : "0");
        render();
      }
      if (localStorage.getItem("storeBigText") === "1")
        document.body.classList.add("big-text");
      if (localStorage.getItem("storeNoMotion") === "1")
        document.body.classList.add("no-motion");
      function startApp() {
        (async function () {
          render();

          // Process any leftover offline queue before loading fresh state
          if (localStorage.getItem(OFFLINE_QUEUE_KEY) && navigator.onLine) {
            await processOfflineQueue();
          }

          await loadState();
          ensureInventoryFields();
          ensureUsername();
          render();
          startAutoRefresh();
          resetInactivityTimer();
        })();
      }

      let autoRefreshStarted = false;
      function startAutoRefresh() {
        if (autoRefreshStarted) return; // guard: startApp() runs again after each auto-lock unlock
        autoRefreshStarted = true;
        setInterval(async () => {
          if (view !== "home" && view !== "summary") return;
          const before = JSON.stringify(state);
          await loadState();
          if (JSON.stringify(state) !== before) {
            render();
          }
        }, 20000);
      }

      if (localStorage.getItem("storeUnlocked") === "true") {
        document.getElementById("lock-screen").style.display = "none";
        startApp();
      }
    </script>
